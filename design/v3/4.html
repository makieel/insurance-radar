.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }

.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-ex { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
.legend .l-fz { border: 1.5px dashed var(--fz); }
.legend .l-now { background: var(--accent); }

  ['메리츠화재', '업무용', '-1', '2026-09-26'], ['메리츠화재', '영업용', '-1', '2026-09-26'], ['현대해상', '영업용', '0', '2026-09-21'],
  ['현대해상', '업무용', '0', '2026-06-16'], ['하나손보', '개인용', '0', '2026-06-08'], ['흥국화재', '개인용', '+1.4', '2026-03-13'],
  ['롯데손보', '개인용', '+1.4', '2026-03-01'], ['메리츠화재', '개인용', '+1.3', '2026-02-21'], ['한화손보', '개인용', '+1.2', '2026-02-21'],
];

const STATUS = [
  ['금융위원회', 'warn', 'RSS 점검 중(503) → 목록 페이지로 수집'], ['금융감독원', 'ok', ''], ['손해보험협회', 'ok', ''], ['손보협회 공시실', 'ok', ''],
  ['생명보험협회', 'ok', ''], ['보험연구원', 'ok', ''], ['보험사 4곳', 'ok', ''], ['보험 전문지 4곳', 'ok', '오늘 37건'],
];

// ── 도우미 ──
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (d) => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
const dayDiff = (d) => Math.round((new Date(TODAY) - new Date(d)) / 86400000);
const dLabel = (c) => { const n = dayDiff(c.date); return n > 0 ? `D+${n}` : n === 0 ? 'D-DAY' : `D${n}`; };
const cc = (cat) => 'c-' + CK[cat];
const link = (o) => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>`;
const srcLinks = (srcs) => srcs.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ');
const sign = (v) => (v.startsWith('+') ? 'up' : v.startsWith('-') ? 'dn' : '');
const DISCLAIMER = '이 사이트는 공개된 보도자료와 기사를 자동으로 모아 보여 주는 정보 제공용이며, 보험 가입이나 해지를 권유하지 않습니다. 요약은 AI가 만들었으므로 정확한 내용은 반드시 원문과 약관에서 확인하세요.';

// ── 레인 카드 ──
const LANES = CATS.slice(1);
const card = (c) => {
  if (c.exact) {
    return `<div class="hc" title="${esc(c.raw + ' · ' + c.src + (c.note ? ' · ' + c.note : ''))}"><div class="w">${md(c.date)} <span class="dn">· ${dLabel(c)}</span></div><div class="t">${link(c)}</div><div class="m">${esc(c.src)}${c.note ? ' · ' + esc(c.note) : ''}</div></div>`;
  }
  return `<div class="hc fz${c.past ? ' stale' : ''}" title="${esc(c.raw + ' · ' + c.src)}"><div class="w">${esc(c.when)}${c.past ? '<span class="ps">(지난 일)</span>' : ' · 날짜 미확정'}</div><div class="t">${link(c)}</div><div class="m">${esc(c.raw)}</div></div>`;
};
const laneHtml = (cat) => {
  const mine = CHANGES.filter((c) => c.cat === cat);
  // 왼쪽(과거): 확정 날짜 오름차순 → 지난 미확정 항목은 오늘 카드 바로 왼쪽
  const pastExact = mine.filter((c) => c.exact && dayDiff(c.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  const pastFuzzy = mine.filter((c) => !c.exact && c.past);
  // 오른쪽(예정): 확정 날짜 오름차순 → 미확정 항목은 맨 오른쪽 끝
  const futExact = mine.filter((c) => c.exact && dayDiff(c.date) < 0).sort((a, b) => a.date.localeCompare(b.date));
  const futFuzzy = mine.filter((c) => !c.exact && !c.past);
  const past = [...pastExact, ...pastFuzzy], fut = [...futExact, ...futFuzzy];
  return `<div class="lane" data-cat="${esc(cat)}">
    <div class="lname ${cc(cat)}">${esc(cat)}<small>지난 ${past.length} · 예정 ${fut.length}</small></div>
    <div class="track" tabindex="0" aria-label="${esc(cat)} 변경 카드 줄 (가로 스크롤)"><div class="strip">
      <div class="grp past">${past.length ? past.map(card).join('') : '<div class="hc empty">최근 시행 없음</div>'}</div>
      <div class="now" aria-label="오늘 ${md(TODAY)}"><span>오늘</span><b>${md(TODAY)}</b></div>
      <div class="grp fut">${fut.length ? fut.map(card).join('') : '<div class="hc empty">예정 없음</div>'}</div>
    </div></div>
  </div>`;
};

// ── 아래 영역 ──
const chipsHtml = () => `<div class="chips" role="group" aria-label="보험 종류 필터">${CATS.map((c, i) => `<button type="button" class="chip${i ? '' : ' on'} ${i ? cc(c) : ''}" data-f="${esc(c)}">${i ? '<span class="dot"></span>' : ''}${esc(c)}</button>`).join('')}</div>`;
const newsItem = (n) => `<div class="item ${cc(n.cat)}" data-cat="${esc(n.cat)}"><div class="top"><span class="k">${esc(n.cat)}</span>${n.srcs.length > 1 ? `· ${n.srcs.length}곳 보도` : ''}</div><h3>${esc(n.title)}</h3><p>${esc(n.sum.join(' '))}</p><div class="srcs">${srcLinks(n.srcs)}</div></div>`;
const offItem = (o) => `<div class="item ${cc(o.cat)}" data-cat="${esc(o.cat)}"><div class="top"><span class="off">공식</span><span class="k">${esc(o.cat)}</span>· ${esc(o.src)} ${md(o.day)}</div><h3>${link(o)}</h3></div>`;
const industryRows = () => INDUSTRY.map((i) => `<div class="row">${link(i)}<span class="n dim">${i.srcs}곳</span></div>`).join('');
const rateRows = () => RATES.map((r) => `<div class="row"><span>${esc(r[0])} · ${esc(r[1])}</span><span class="n ${sign(r[2])}">${md(r[3])} &nbsp; ${esc(r[2])}%</span></div>`).join('');
const statusHtml = () => `<div class="status">${STATUS.map((s) => `<span class="${s[1] === 'ok' ? '' : 'w'}">${s[1] === 'ok' ? '✓' : '⚠'} ${esc(s[0])}${s[2] ? ' · ' + esc(s[2]) : ''}</span>`).join('')}</div>`;

document.getElementById('app').innerHTML = `
  <header>
    <div><div class="tag">시안 v3-4 · 레인 가로 카드 줄</div><h1>보험 <span>레이더</span></h1></div>
    <div class="d">2026.10.23 (금) 09:00 갱신 · 새 소식 37 · 공식 발표 ${OFFICIAL.length}</div>
  </header>
  <section class="card top-card" aria-label="바뀌는 것">
    <div class="tc-head">
      <h2>바뀌는 것 · 보험 종류별 <small>줄마다 옆으로 넘겨 보세요</small></h2>
      <div class="legend"><span><i class="l-ex"></i>시행일 확정 (날짜 · 지난 날수)</span><span><i class="l-fz"></i>날짜 미확정 · 원문 표현</span><span><i class="l-now"></i>오늘</span></div>
    </div>
    <div class="lanes">${LANES.map(laneHtml).join('')}</div>
    <div class="axis-hint"><span></span><div><span>← 지난 것</span><span>예정 →</span></div></div>
  </section>
  ${chipsHtml()}
  <div class="below">
    <div class="col">
      <div class="news"><h2 class="sec-title">오늘 소식</h2>${NEWS.map(newsItem).join('')}</div>
      <div class="news"><h2 class="sec-title">공식 발표 · 정부 · 감독기관</h2>${OFFICIAL.map(offItem).join('')}</div>
    </div>
    <div class="col">
      <div class="card"><h2>자동차보험료 조정 <small>손보협회 공시실</small></h2>${rateRows()}</div>
      <div class="card"><h2>업계 동향 <small>보도 곳 수</small></h2>${industryRows()}</div>
      <div class="card"><h2>수집 상태 <small>${STATUS.filter((s) => s[1] === 'ok').length}/${STATUS.length} 정상</small></h2>${statusHtml()}</div>
    </div>
  </div>
  <footer>${esc(DISCLAIMER)}</footer>`;

// ── 오늘 카드 정렬 · 첫 스크롤 위치 ──
const alignLanes = (resetScroll) => {
  // 모든 줄의 과거·예정 묶음 폭을 맞춰서 오늘 카드가 같은 세로선에 서게 한다
  ['.grp.past', '.grp.fut'].forEach((sel) => {
    const gs = [...document.querySelectorAll(sel)];
    gs.forEach((g) => { g.style.minWidth = ''; });
    const w = Math.max(...gs.map((g) => g.scrollWidth));
    gs.forEach((g) => { g.style.minWidth = w + 'px'; });
  });
  if (!resetScroll) return;
  document.querySelectorAll('.track').forEach((tr) => {
    const now = tr.querySelector('.now');
    tr.scrollLeft = Math.max(0, now.offsetLeft + now.offsetWidth / 2 - tr.clientWidth * 0.62);
  });
};
alignLanes(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignLanes(true));
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => alignLanes(true), 150); });

// ── 필터 ──
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const f = chip.dataset.f;
  document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
  document.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('hide', f !== '전체' && el.dataset.cat !== f));
});

// ── 테마 토글 (iframe 밖에서만) ──
const themeBtn = document.getElementById('themeBtn');
const syncThemeBtn = () => { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
if (window.top === window) {
  themeBtn.hidden = false;
  syncThemeBtn();
  themeBtn.addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; });
  new MutationObserver(syncThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
</script>
</body>
</html>

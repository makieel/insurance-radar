<style>
:root {

  --accent:#0f766e; --accent-soft:#ccfbf1; --on-accent:#ffffff;
  --today:#dc2626; --fz:#c2410c; --fz-soft:#ffedd5;
  --car:#0369a1; --med:#e11d48; --life:#15803d; --ind:#7c3aed;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.05);
  --radius:14px;
}
[data-theme="dark"] {
  --bg:#071412; --panel:#0d1f1c; --ink:#e3f1ee; --ink2:#a9c4be; --ink3:#83a09a; --line:#1d3a36; --line2:#15302c;
  --accent:#2dd4bf; --accent-soft:#0c3a35; --on-accent:#04201c;
  --today:#fb7185; --fz:#fb923c; --fz-soft:#3a1d08;
  --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#a78bfa;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.hide { display: none !important; }
.mono { font-family: "JetBrains Mono", monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.c-car { --c: var(--car); } .c-med { --c: var(--med); } .c-life { --c: var(--life); } .c-ind { --c: var(--ind); }
.catdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c, var(--ink3)); flex: none; }

/* 머리 */
header { padding: 14px 0 10px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 4px 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 99px; margin-bottom: 4px; }
header h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
header h1 span { color: var(--accent); }
header .d { color: var(--ink2); font-size: 13px; }
.sh { margin: 0 0 8px; font-size: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sh small { font-size: 12px; color: var(--ink3); font-weight: 500; }

/* 타일 */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--radius); padding: 12px 14px 12px; box-shadow: var(--shadow); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.tile:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); border-top-color: var(--c); }
.tile.on { border-color: var(--accent); border-top-color: var(--c); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.tile > span { display: block; }
.tname { display: flex !important; align-items: center; justify-content: space-between; gap: 8px; font-size: 17px; font-weight: 800; color: var(--c); }
.tname .open { font-size: 11px; font-weight: 700; color: var(--ink3); white-space: nowrap; }
.tile.on .tname .open { color: var(--accent); }
.tnum { font-size: 13px; color: var(--ink2); }
.tnum b { font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 2px 0 3px; vertical-align: -1px; }
.tnum b.fzn { color: var(--fz); }
.tnum b.zero { color: var(--ink3); }
/* 미니 축 */
.mini { display: flex !important; align-items: center; gap: 8px; }
.ax { position: relative; display: block; flex: 1; height: 38px; min-width: 0; }
.ax .base { position: absolute; left: 0; right: 0; top: 17px; height: 2px; background: var(--line); }
.ax .tk { position: absolute; top: 13px; width: 1px; height: 10px; background: var(--ink3); }
.ax .tl { position: absolute; top: 25px; font-size: 10px; color: var(--ink3); white-space: nowrap; transform: translateX(-50%); }
.ax .tl.s { transform: none; } .ax .tl.e { transform: translateX(-100%); }
.ax .now { position: absolute; top: 2px; height: 30px; width: 2px; margin-left: -1px; background: var(--today); }
.ax .now i { position: absolute; top: -2px; right: 5px; font-style: normal; font-size: 10px; font-weight: 700; color: var(--today); white-space: nowrap; }
.ax .dot { position: absolute; top: 12px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--panel); border: 3px solid var(--c); }
.ax .emp { position: absolute; left: 34%; top: 2px; transform: translateX(-50%); font-size: 10.5px; color: var(--ink3); white-space: nowrap; }
.fzpill { flex: none; font-size: 11px; font-weight: 700; color: var(--fz); border: 1.5px dashed var(--fz); border-radius: 99px; padding: 2px 7px; white-space: nowrap; }
.tline { border-top: 1px solid var(--line2); padding-top: 7px; font-size: 13px; line-height: 1.4; }
.tline .lab { display: block; font-size: 11px; font-weight: 700; color: var(--ink3); margin-bottom: 1px; }
.tline .lab.fzl { color: var(--fz); }
.tline .w { font-weight: 800; font-size: 12.5px; margin-right: 6px; color: var(--ink2); }
.tline .w.fz { color: var(--fz); }
.tline .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tline .none { color: var(--ink3); }
.tline .more { font-size: 11.5px; color: var(--ink3); }
.tile.on::after { content: ""; position: absolute; left: 50%; bottom: -15px; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--accent); }

/* 펼친 상세 (3번식 레인) */
.detail { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: var(--radius); padding: 12px 14px 14px; box-shadow: var(--shadow); margin-top: 4px; }
.dh { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.dh h3 { margin: 0; font-size: 16px; color: var(--c); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.dh h3 small { color: var(--ink2); font-size: 12.5px; font-weight: 600; }
.dh .sp { flex: 1; }
.ghost { cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; }
.ghost:hover { border-color: var(--accent); }
.lane { display: grid; grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1fr); grid-template-areas: "h1 hn h2" "c1 nc c2"; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lane .lh { grid-area: h1; font-size: 12px; font-weight: 700; color: var(--ink2); background: var(--bg); padding: 7px 12px; border-bottom: 1px solid var(--line); }
.lane .lh.fzh { grid-area: h2; color: var(--fz); }
.lane .nowh { grid-area: hn; background: var(--bg); color: var(--today); font-size: 11px; font-weight: 700; text-align: center; padding: 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lane .nowcol { grid-area: nc; background: repeating-linear-gradient(180deg, var(--today) 0 6px, transparent 6px 12px) center / 2px 100% no-repeat; }
.lane .cell { grid-area: c1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 10px 12px; align-content: start; }
.lane .cell.fut { grid-area: c2; }
.tkt { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 7px 10px; font-size: 13px; line-height: 1.4; background: var(--panel); min-width: 0; }
.tkt.fz { border-style: dashed; border-color: var(--fz); border-left: 3px dashed var(--fz); }
.tkt .w { font-weight: 800; font-size: 12px; color: var(--ink2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.tkt.fz .w { color: var(--fz); }
.tkt .t { margin: 2px 0; font-weight: 600; }
.tkt .m { font-size: 11.5px; color: var(--ink3); }
.badge { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }

.badge.ps { background: var(--line2); color: var(--ink2); }
.none2 { font-size: 12.5px; color: var(--ink3); padding: 4px 0; }
.legend { margin: 8px 2px 0; font-size: 11.5px; color: var(--ink3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend i { font-style: normal; display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--ink3); vertical-align: 3px; margin-right: 4px; }
.legend i.fz { border-top: 2px dashed var(--fz); }
.legend i.now { width: 2px; height: 11px; border: 0; background: var(--today); vertical-align: -1px; }

.feed { margin-top: 22px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.news { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
.item .top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink3); margin-bottom: 4px; flex-wrap: wrap; }
.item .cat { font-weight: 700; color: var(--c, var(--accent)); }
.off { font-weight: 700; color: var(--panel); background: var(--ink); padding: 0 6px; border-radius: 4px; font-size: 11.5px; }
.item h3 { margin: 0 0 6px; font-size: 15.5px; line-height: 1.4; }
.item p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.6; }
.item .srcs { margin-top: 8px; font-size: 12px; color: var(--ink3); }
.empty { margin: -8px 0 18px; font-size: 13px; color: var(--ink3); }
.rail { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card > h2 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card > h2 small { font-size: 11.5px; color: var(--ink3); font-weight: 500; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line2); font-size: 13px; }
.row:last-child { border-bottom: 0; }
.row > a, .row > span:first-child { min-width: 0; }
.row .n { font-family: "JetBrains Mono", monospace; font-weight: 600; white-space: nowrap; }
.n.up { color: var(--med); } .n.dn { color: var(--car); }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.status .w { color: var(--fz); }
footer { margin: 20px 0 0; padding: 16px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }

/* 단독으로 열었을 때만 보이는 테마 토글 */
.themebtn { position: fixed; top: 10px; right: 10px; z-index: 20; cursor: pointer; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink2); box-shadow: var(--shadow); }

@media (max-width: 1000px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .below { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 700px) {
  .lane { grid-template-columns: minmax(0, 1fr); grid-template-areas: "h1" "c1" "hn" "h2" "c2"; }
  .lane .nowcol { display: none; }
  .lane .nowh { display: flex; align-items: center; gap: 8px; padding: 6px 12px; text-align: left; border-top: 1px solid var(--line); }
  .lane .nowh::after { content: ""; flex: 1; border-top: 2px dashed var(--today); }
  .lane .lh.fzh { border-top: 0; }
  .news { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 560px) {
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .lane .cell { grid-template-columns: minmax(0, 1fr); }
  header h1 { font-size: 21px; }
}
</style>

  ['메리츠화재', '업무용', '-1', '2026-09-26'], ['메리츠화재', '영업용', '-1', '2026-09-26'], ['현대해상', '영업용', '0', '2026-09-21'],
  ['현대해상', '업무용', '0', '2026-06-16'], ['하나손보', '개인용', '0', '2026-06-08'], ['흥국화재', '개인용', '+1.4', '2026-03-13'],
  ['롯데손보', '개인용', '+1.4', '2026-03-01'], ['메리츠화재', '개인용', '+1.3', '2026-02-21'], ['한화손보', '개인용', '+1.2', '2026-02-21'],
];

const STATUS = [
  ['금융위원회', 'warn', 'RSS 점검 중(503) → 목록 페이지로 수집'], ['금융감독원', 'ok', ''], ['손해보험협회', 'ok', ''], ['손보협회 공시실', 'ok', ''],
  ['생명보험협회', 'ok', ''], ['보험연구원', 'ok', ''], ['보험사 4곳', 'ok', ''], ['보험 전문지 4곳', 'ok', '오늘 37건'],
];

// ── 도우미 (v2와 같은 방식) ──
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (d) => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
const dayDiff = (d) => Math.round((new Date(TODAY) - new Date(d)) / 86400000);
const dLabel = (c) => { const n = dayDiff(c.date); return n > 0 ? `D+${n}` : n === 0 ? 'D-DAY' : `D${n}`; };
const upcoming = CHANGES.filter((c) => !c.exact && !c.past);
const recent = CHANGES.filter((c) => c.exact || c.past);
const cc = (cat) => 'c-' + CK[cat];
const srcLinks = (srcs) => srcs.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ');
const link = (o) => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>`;
const DISCLAIMER = '이 사이트는 공개된 보도자료와 기사를 자동으로 모아 보여 주는 정보 제공용이며, 보험 가입이나 해지를 권유하지 않습니다. 요약은 AI가 만들었으므로 정확한 내용은 반드시 원문과 약관에서 확인하세요.';
const sign = (v) => (v.startsWith('+') ? 'up' : v.startsWith('-') ? 'dn' : '');
const LANES = CATS.slice(1);

// 종류별로 데이터에서 계산만 한다
const byCat = (cat) => {
  const past = recent.filter((c) => c.cat === cat);
  const fut = upcoming.filter((c) => c.cat === cat);
  const exact = past.filter((c) => c.exact).sort((a, b) => b.date.localeCompare(a.date));
  return { past, fut, exact, latest: exact[0] || past[0] || null, fuzzyN: CHANGES.filter((c) => c.cat === cat && !c.exact).length };
};
const whenTxt = (c) => (c.exact ? `${md(c.date)} · ${dLabel(c)}` : esc(c.when) + (c.past ? ' (지난 일)' : ''));

// 미니 가로 축 (9.1 ~ 10.31, 2번 축의 축소판)
const AX0 = new Date('2026-09-01'), AX1 = new Date('2026-10-31');
const pos = (d) => (((new Date(d) - AX0) / (AX1 - AX0)) * 100).toFixed(2);
const miniAxis = (s) => {
  const ticks = [['2026-09-01', 's'], ['2026-10-01', 'm'], ['2026-10-31', 'e']]
    .map(([d, a]) => `<span class="tk" style="left:${pos(d)}%"></span><span class="tl ${a}" style="left:${pos(d)}%">${md(d)}</span>`).join('');
  const dots = s.exact.map((c) => `<span class="dot" style="left:${pos(c.date)}%" title="${esc(md(c.date) + ' · ' + c.title)}"></span>`).join('');
  return `<span class="mini"><span class="ax" aria-hidden="true"><span class="base"></span>${ticks}<span class="now" style="left:${pos(TODAY)}%"><i>오늘</i></span>${dots}${s.exact.length ? '' : '<span class="emp">확정 날짜 없음</span>'}</span>`
    + `<span class="sr">9~10월 시행일이 확정된 항목 ${s.exact.length}건</span>${s.fuzzyN ? `<span class="fzpill" title="날짜가 정확하지 않아 축에 놓지 않은 항목">미확정 ${s.fuzzyN}</span>` : ''}</span>`;
};

const tile = (cat) => {
  const s = byCat(cat), L = s.latest, F = s.fut[0];
  const num = (n, fz) => `<b class="${n ? (fz ? 'fzn' : '') : 'zero'}">${n}</b>`;
  return `<button type="button" class="tile ${cc(cat)}" data-k="${esc(cat)}" aria-expanded="false" aria-controls="detail">
    <span class="tname"><span><span class="catdot"></span>${esc(cat)}</span><span class="open">상세 보기 ▾</span></span>
    <span class="tnum">최근 시행${num(s.past.length)} · 예정${num(s.fut.length, true)}</span>
    ${miniAxis(s)}
    <span class="tline"><span class="lab">가장 최근 시행</span>${L ? `<span class="tt"><span class="w${L.exact ? '' : ' fz'}">${whenTxt(L)}</span>${esc(L.title)}</span>` : '<span class="tt none">최근 시행된 항목 없음</span>'}</span>
    <span class="tline"><span class="lab fzl">예정 · 날짜 미확정</span>${F ? `<span class="tt"><span class="w fz">${esc(F.when)}</span>${esc(F.title)}</span>${s.fut.length > 1 ? `<span class="more">외 ${s.fut.length - 1}건</span>` : ''}` : '<span class="tt none">예정된 항목 없음</span>'}</span>
  </button>`;
};

const tkt = (c) => `<div class="tkt ${cc(c.cat)}${c.exact ? '' : ' fz'}"><div class="w">${c.exact ? `${md(c.date)} <span class="badge ps">${dLabel(c)}</span>` : `${whenTxt(c)} <span class="badge fz">날짜 미확정</span>`}</div><div class="t">${link(c)}</div><div class="m">${esc(c.raw)} · ${esc(c.src)}${c.note ? ' · ' + esc(c.note) : ''}${c.pub ? ' · ' + md(c.pub) + ' 발표' : ''}</div></div>`;
const detailHtml = (cat) => {
  const s = byCat(cat);
  const nNews = NEWS.filter((n) => n.cat === cat).length, nOff = OFFICIAL.filter((o) => o.cat === cat).length;
  return `<div class="dh"><h3><span><span class="catdot"></span>${esc(cat)}</span><small>최근 시행 ${s.past.length} · 예정 ${s.fut.length}</small></h3><span class="sp"></span>
      <button type="button" class="ghost" data-jump="${esc(cat)}">아래 소식도 ${esc(cat)}만 보기 · 소식 ${nNews} · 공식 ${nOff}</button></div>
    <div class="lane">
      <div class="lh">최근 시행</div><div class="nowh">오늘 ${md(TODAY)}</div><div class="lh fzh">예정</div>
      <div class="cell">${s.past.length ? s.past.map(tkt).join('') : '<div class="none2">최근 시행된 항목 없음</div>'}</div>
      <div class="nowcol" aria-hidden="true"></div>
      <div class="cell fut">${s.fut.length ? s.fut.map(tkt).join('') : '<div class="none2">예정된 항목 없음</div>'}</div>
    </div>`;
};

const chipsHtml = () => `<div class="chips" role="group" aria-label="보험 종류 필터">${CATS.map((c, i) => `<button type="button" class="chip${i ? '' : ' on'}" data-f="${esc(c)}" aria-pressed="${i ? 'false' : 'true'}">${i ? `<span class="catdot ${cc(c)}"></span>` : ''}${esc(c)}</button>`).join('')}</div>`;
const newsItem = (n) => `<div class="item ${cc(n.cat)}" data-cat="${esc(n.cat)}"><div class="top"><span class="cat"><span class="catdot"></span>${esc(n.cat)}</span>${n.srcs.length > 1 ? `· ${n.srcs.length}곳 보도` : ''}</div><h3>${esc(n.title)}</h3><p>${esc(n.sum.join(' '))}</p><div class="srcs">${srcLinks(n.srcs)}</div></div>`;
const offItem = (o) => `<div class="item ${cc(o.cat)}" data-cat="${esc(o.cat)}"><div class="top"><span class="off">공식</span><span class="cat"><span class="catdot"></span>${esc(o.cat)}</span>· ${esc(o.src)} ${md(o.day)}</div><h3>${link(o)}</h3></div>`;
const industryRows = () => INDUSTRY.map((i) => `<div class="row">${link(i)}<span class="n">${i.srcs}곳</span></div>`).join('');
const rateRows = () => RATES.map((r) => `<div class="row"><span>${esc(r[0])} · ${esc(r[1])}</span><span class="n ${sign(r[2])}">${md(r[3])} &nbsp; ${esc(r[2])}%</span></div>`).join('');
const statusHtml = () => `<div class="status">${STATUS.map((s) => `<span class="${s[1] === 'ok' ? '' : 'w'}">${s[1] === 'ok' ? '✓' : '⚠'} ${esc(s[0])}${s[2] ? ' · ' + esc(s[2]) : ''}</span>`).join('')}</div>`;

// ── 화면 ──
document.getElementById('app').innerHTML = `
  <header>
    <div><span class="tag">시안 v3-5 · 종류별 타일</span><h1>보험 <span>레이더</span></h1></div>
    <div class="d">2026.10.23 (금) 09:00 갱신 · 새 소식 37 · 공식 발표 ${OFFICIAL.length}</div>
  </header>
  <h2 class="sh">바뀌는 것 · 보험 종류별 <small>타일을 누르면 바로 아래에 "최근 시행 | 오늘 | 예정"이 펼쳐집니다</small></h2>
  <div class="tiles" id="tiles">${LANES.map(tile).join('')}<section class="detail" id="detail" aria-live="polite" hidden></section></div>
  <div class="legend"><span><i></i>시행일 확정 (축에 점)</span><span><i class="fz"></i>날짜 미확정 · 원문 표현 그대로 (축에 놓지 않음)</span><span><i class="now"></i> 오늘 ${md(TODAY)}</span></div>

  <div class="feed" id="feed">
    ${chipsHtml()}
    <div class="below">
      <div>
        <h2 class="sh">오늘 소식 <small>같은 주제를 여러 곳이 보도하면 한 장으로 묶음</small></h2>
        <div class="news" data-list>${NEWS.map(newsItem).join('')}</div><p class="empty hide">이 종류의 오늘 소식은 없습니다.</p>
        <h2 class="sh">공식 발표 <small>정부·감독기관</small></h2>
        <div class="news" data-list>${OFFICIAL.map(offItem).join('')}</div><p class="empty hide">이 종류의 공식 발표는 없습니다.</p>
      </div>
      <aside class="rail">
        <div class="card" data-cat="자동차"><h2>자동차보험료 조정 <small>손보협회 공시실 · 시행일</small></h2>${rateRows()}</div>
        <div class="card"><h2>업계 동향 <small>보도한 곳 수</small></h2>${industryRows()}</div>
        <div class="card"><h2>수집 상태</h2>${statusHtml()}</div>
      </aside>
    </div>
  </div>
  <footer>${DISCLAIMER}</footer>`;

// ── 타일 펼치기: 누른 타일이 있는 줄 바로 아래에 상세를 끼운다 ──
const grid = document.getElementById('tiles'), detail = document.getElementById('detail');
let open = '자동차';
const place = () => {
  const tiles = [...grid.querySelectorAll('.tile')];
  tiles.forEach((t) => { const on = t.dataset.k === open; t.classList.toggle('on', on); t.setAttribute('aria-expanded', String(on)); t.querySelector('.open').textContent = on ? '접기 ▴' : '상세 보기 ▾'; });
  if (!open) { detail.hidden = true; return; }
  const n = Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length);
  const i = tiles.findIndex((t) => t.dataset.k === open);
  const after = tiles[Math.min(tiles.length - 1, Math.floor(i / n) * n + n - 1)];
  if (after.nextElementSibling !== detail) after.after(detail);
  detail.hidden = false;
};
const openCat = (cat) => {
  open = cat;
  if (cat) { detail.className = 'detail ' + cc(cat); detail.setAttribute('aria-label', cat + ' 상세'); detail.innerHTML = detailHtml(cat); }
  place();
};
openCat(open);
let rz; const replace = () => { clearTimeout(rz); rz = setTimeout(place, 60); };
addEventListener('resize', replace);
if (window.ResizeObserver) new ResizeObserver(replace).observe(grid);

// ── 필터 (아래 소식 영역) ──
const feed = document.getElementById('feed');
const applyFilter = (f) => {
  feed.querySelectorAll('.chip').forEach((c) => { const on = c.dataset.f === f; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
  feed.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('hide', f !== '전체' && el.dataset.cat !== f));
  feed.querySelectorAll('[data-list]').forEach((l) => l.nextElementSibling.classList.toggle('hide', !!l.querySelector('[data-cat]:not(.hide)')));
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('.tile');
  if (t) { openCat(open === t.dataset.k ? null : t.dataset.k); return; }
  const chip = e.target.closest('.chip');
  if (chip) { applyFilter(chip.dataset.f); return; }
  const j = e.target.closest('[data-jump]');
  if (j) { applyFilter(j.dataset.jump); feed.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});

// ── 단독으로 열었을 때만 테마 토글 ──
if (window.top === window) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'themebtn';
  const label = () => { b.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
  b.onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; label(); };
  label(); document.body.appendChild(b);
}
</script>

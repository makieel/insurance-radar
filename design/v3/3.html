  ['메리츠화재', '업무용', '-1', '2026-09-26'], ['메리츠화재', '영업용', '-1', '2026-09-26'], ['현대해상', '영업용', '0', '2026-09-21'],
  ['현대해상', '업무용', '0', '2026-06-16'], ['하나손보', '개인용', '0', '2026-06-08'], ['흥국화재', '개인용', '+1.4', '2026-03-13'],
  ['롯데손보', '개인용', '+1.4', '2026-03-01'], ['메리츠화재', '개인용', '+1.3', '2026-02-21'], ['한화손보', '개인용', '+1.2', '2026-02-21'],
];

const STATUS = [
  ['금융위원회', 'warn', 'RSS 점검 중(503) → 목록 페이지로 수집'], ['금융감독원', 'ok', ''], ['손해보험협회', 'ok', ''], ['손보협회 공시실', 'ok', ''],
  ['생명보험협회', 'ok', ''], ['보험연구원', 'ok', ''], ['보험사 4곳', 'ok', ''], ['보험 전문지 4곳', 'ok', '오늘 37건'],
];

// ── 도우미 ──
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (d) => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
const dayDiff = (d) => Math.round((new Date(TODAY) - new Date(d)) / 86400000);
const dLabel = (c) => { const n = dayDiff(c.date); return n > 0 ? `D+${n}` : n === 0 ? 'D-DAY' : `D${n}`; };
const cc = (cat) => 'c-' + CK[cat];
const link = (o) => `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>`;
const srcLinks = (srcs) => srcs.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ');
const sign = (v) => (v.startsWith('+') ? 'up' : v.startsWith('-') ? 'dn' : '');
const DISCLAIMER = '이 사이트는 공개된 보도자료와 기사를 자동으로 모아 보여 주는 정보 제공용이며, 보험 가입이나 해지를 권유하지 않습니다. 요약은 AI가 만들었으므로 정확한 내용은 반드시 원문과 약관에서 확인하세요.';

// ── 주 단위 칸 계산 (월요일 시작, 9월 첫 주 ~ 이번 주) ──
const DAY = 86400000;
const ROWS = CATS.slice(1);
const W0 = new Date('2026-08-31');
const MONTH_START = new Date('2026-09-01');
const NW = Math.floor((new Date(TODAY) - W0) / (7 * DAY)) + 1;
const NOW_W = NW - 1;
const weeks = Array.from({ length: NW }, (_, i) => { const s = new Date(W0.getTime() + i * 7 * DAY); return { s, e: new Date(s.getTime() + 6 * DAY) }; });
const fmt = (d) => `${d.getUTCMonth() + 1}.${d.getUTCDate()}`;
const wkLabel = (i) => { const w = weeks[i]; const s = i === 0 ? MONTH_START : w.s; return `${fmt(s)}–${w.e.getUTCMonth() === s.getUTCMonth() ? w.e.getUTCDate() : fmt(w.e)}`; };
const weekOf = (d) => Math.floor((new Date(d) - W0) / (7 * DAY));
const exactItems = CHANGES.filter((c) => c.exact).sort((a, b) => a.date.localeCompare(b.date));
const fuzzyItems = CHANGES.filter((c) => !c.exact).sort((a, b) => (a.past ? 1 : 0) - (b.past ? 1 : 0));
const cellItems = (cat, col) => col === 'fz'
  ? fuzzyItems.filter((c) => c.cat === cat)
  : exactItems.filter((c) => c.cat === cat && weekOf(c.date) === col);

const exBadge = (c) => `<span class="bd" title="${esc(c.title)}"><b>${md(c.date)}</b><span class="bt">${esc(c.title)}</span></span>`;
const fzBadge = (c) => `<div class="fzi${c.past ? ' past' : ''}"><div class="w">${esc(c.when)}${c.past ? '<span class="ps">(지난 일)</span>' : ''}</div><div class="tt" title="${esc(c.title)}">${esc(c.title)}</div></div>`;
const colName = (col) => (col === 'fz' ? '예정 · 날짜 미확정' : `${wkLabel(col)} 주${col === NOW_W ? ' (이번 주)' : ''}`);
const cellTd = (cat, col) => {
  const items = cellItems(cat, col);
  const cls = ['cell', items.length ? '' : 'empty', col === NOW_W ? 'tw' : '', col === 'fz' ? 'fzc' : ''].filter(Boolean).join(' ');
  const inner = col === 'fz' ? (items.length ? items.map(fzBadge).join('') : '<span class="none">없음</span>') : items.map(exBadge).join('');
  return `<td class="${cls}" tabindex="0" role="button" aria-label="${esc(cat)} ${esc(colName(col))} ${items.length}건" data-r="${esc(cat)}" data-c="${col}">${inner}</td>`;
};
const matrixHtml = () => `<div class="mxwrap"><table class="mx">
  <colgroup><col class="c-rh">${weeks.map(() => '<col>').join('')}<col class="c-fz"></colgroup>
  <thead><tr><th class="corner">보험 종류 · 주</th>${weeks.map((w, i) => `<th class="${i === NOW_W ? 'now' : ''}"><span class="wn">${wkLabel(i)}</span>${i === NOW_W ? `오늘 ${md(TODAY)}` : `${i + 1}주차`}</th>`).join('')}<th class="fzh"><span class="wn">예정 · 날짜 미확정</span>원문 표현 그대로</th></tr></thead>
  <tbody>${ROWS.map((cat) => {
    const nx = CHANGES.filter((c) => c.exact && c.cat === cat).length, nf = CHANGES.filter((c) => !c.exact && c.cat === cat).length;
    return `<tr data-row="${esc(cat)}"><th class="rh ${cc(cat)}" scope="row">${esc(cat)}<small>확정 ${nx} · 미확정 ${nf}</small></th>${weeks.map((w, i) => cellTd(cat, i)).join('')}${cellTd(cat, 'fz')}</tr>`;
  }).join('')}</tbody></table></div>`;

const detailItem = (c) => c.exact
  ? `<div class="di"><div class="w">${md(c.date)} 시행<span class="pill">${dLabel(c)}</span></div><h3>${link(c)}</h3><div class="raw">${esc(c.raw)}</div><div class="src">출처 <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)} ↗</a>${c.note ? ' · ' + esc(c.note) : ''}</div></div>`
  : `<div class="di fz"><div class="w">${esc(c.when)}${c.past ? ' (지난 일)' : ''}<span class="pill">날짜 미확정</span></div><h3>${link(c)}</h3><div class="raw">${esc(c.raw)}</div><div class="src">출처 <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)} ↗</a>${c.pub ? ' · ' + md(c.pub) + ' 발표' : ''}</div></div>`;
const HINT = '<div class="hint">표의 칸을 누르면 그 칸의 항목 상세(제목 · 원문 표현 · 출처 링크)가 여기에 펼쳐집니다.</div>';
const detailHtml = (cat, col) => {
  const items = cellItems(cat, col);
  return `<div class="dh"><span><span class="cat">${esc(cat)}</span> · ${esc(colName(col))} · ${items.length}건</span><button type="button" data-close>닫기</button></div>
    <div class="dl">${items.length ? items.map(detailItem).join('') : `<div class="di"><div class="empty-msg">${col === 'fz' ? '날짜 미확정 예정 항목이 없습니다.' : '이 주에 시행된 변경이 없습니다.'}</div></div>`}</div>`;
};

// ── 아래 영역 ──
const chipsHtml = () => `<div class="chips" role="group" aria-label="보험 종류 필터">${CATS.map((c, i) => `<button type="button" class="chip${i ? '' : ' on'}" data-f="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
const newsItem = (n) => `<div class="item" data-cat="${esc(n.cat)}"><div class="top"><span class="k">${esc(n.cat)}</span>${n.srcs.length > 1 ? `· ${n.srcs.length}곳 보도` : ''}</div><h3>${esc(n.title)}</h3><p>${esc(n.sum.join(' '))}</p><div class="srcs">${srcLinks(n.srcs)}</div></div>`;
const offItem = (o) => `<div class="item" data-cat="${esc(o.cat)}"><div class="top"><span class="off">공식</span><span class="k">${esc(o.cat)}</span>· ${esc(o.src)} ${md(o.day)}</div><h3>${link(o)}</h3></div>`;
const industryRows = () => INDUSTRY.map((i) => `<div class="row">${link(i)}<span class="n dim">${i.srcs}곳</span></div>`).join('');
const rateRows = () => RATES.map((r) => `<div class="row"><span>${esc(r[0])} · ${esc(r[1])}</span><span class="n ${sign(r[2])}">${md(r[3])} &nbsp; ${esc(r[2])}%</span></div>`).join('');
const statusRows = () => STATUS.map((s) => `<div class="st"><span>${esc(s[0])}${s[2] ? `<small>${esc(s[2])}</small>` : ''}</span><span class="${s[1] === 'ok' ? 'ok' : 'w'}">${s[1] === 'ok' ? '✓ 정상' : '⚠ 점검'}</span></div>`).join('');

document.getElementById('app').innerHTML = `
  <header>
    <div><div class="tag">시안 v3-3 · 주간 매트릭스</div><h1>보험 <span>레이더</span></h1></div>
    <div class="d">2026.10.23 (금) 09:00 갱신 · 새 소식 37 · 공식 발표 ${OFFICIAL.length}</div>
  </header>
  <section class="card" aria-label="바뀌는 것">
    <div class="mx-top">
      <h2>바뀌는 것 <small>보험 종류 × 주 · 시행일 확정 ${exactItems.length}건 · 미확정 ${fuzzyItems.length}건</small></h2>
      <div class="legend"><span><i class="l-ex"></i>시행일 확정 (날짜 · 제목)</span><span><i class="l-now"></i>이번 주</span><span><i class="l-fz"></i>날짜 미확정 · 원문 표현</span></div>
    </div>
    ${matrixHtml()}
    <div class="detail" id="detail" aria-live="polite">${HINT}</div>
  </section>
  ${chipsHtml()}
  <div class="below">
    <div class="col"><div class="card"><h2>오늘 소식 <small>${NEWS.length}개 주제</small></h2>${NEWS.map(newsItem).join('')}</div></div>
    <div class="col">
      <div class="card"><h2>공식 발표 <small>정부 · 감독기관</small></h2>${OFFICIAL.map(offItem).join('')}</div>
      <div class="card"><h2>업계 동향 <small>보도 곳 수</small></h2>${industryRows()}</div>
    </div>
    <div class="col">
      <div class="card"><h2>자동차보험료 조정 <small>손보협회 공시실</small></h2>${rateRows()}</div>
      <div class="card"><h2>수집 상태 <small>${STATUS.filter((s) => s[1] === 'ok').length}/${STATUS.length} 정상</small></h2>${statusRows()}</div>
    </div>
  </div>
  <footer>${esc(DISCLAIMER)}</footer>`;

// 좁은 화면: 표 안에서 이번 주 칸부터 보이도록 스크롤
const mxw = document.querySelector('.mxwrap');
if (mxw.scrollWidth > mxw.clientWidth) mxw.scrollLeft = mxw.querySelector('th.now').offsetLeft - mxw.querySelector('th.corner').offsetWidth;

// ── 동작: 칸 선택 · 필터 ──
const detail = document.getElementById('detail');
let selKey = '';
const select = (td) => {
  const key = td ? td.dataset.r + '|' + td.dataset.c : '';
  document.querySelectorAll('.mx td.sel').forEach((t) => t.classList.remove('sel'));
  if (!td || key === selKey) { selKey = ''; detail.innerHTML = HINT; return; }
  selKey = key;
  td.classList.add('sel');
  const col = td.dataset.c === 'fz' ? 'fz' : +td.dataset.c;
  detail.innerHTML = detailHtml(td.dataset.r, col);
};
document.addEventListener('click', (e) => {
  const td = e.target.closest('td.cell');
  if (td) { select(td); return; }
  if (e.target.closest('[data-close]')) { select(null); return; }
  const chip = e.target.closest('.chip');
  if (chip) {
    const f = chip.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
    document.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('hide', f !== '전체' && el.dataset.cat !== f));
    document.querySelectorAll('.mx tr[data-row]').forEach((tr) => tr.classList.toggle('dim', f !== '전체' && tr.dataset.row !== f));
  }
});
document.addEventListener('keydown', (e) => {
  const td = e.target.closest && e.target.closest('td.cell');
  if (td && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(td); }
});

// ── 테마 토글 (iframe 밖에서만) ──
const themeBtn = document.getElementById('themeBtn');
const syncThemeBtn = () => { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
if (window.top === window) {
  themeBtn.hidden = false;
  syncThemeBtn();
  themeBtn.addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; });
  new MutationObserver(syncThemeBtn).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
</script>

  --accent:#0f8a80; --accent-soft:#d5f3ef; --on-accent:#ffffff;
  --today:#dc2626; --on-today:#ffffff;
  --fz:#c2410c; --fz-soft:#fff3ea;
  --car:#2563eb; --med:#e11d48; --life:#16a34a; --ind:#7c3aed;
  --up:#e11d48; --dn:#2563eb; --warn:#c2410c;
  --radius:12px;
}
[data-theme="dark"] {
  --bg:#0a0f1c; --panel:#111a2d; --ink:#e4e9f4; --ink2:#aab5cb; --ink3:#8592ad; --line:#24324f;
  --navy:#b8c8ea; --navy-soft:#1a2642; --strip:#0d1525;
  --accent:#2dd4bf; --accent-soft:#0d3a3a; --on-accent:#03201c;
  --today:#fb7185; --on-today:#2a070d;
  --fz:#fb923c; --fz-soft:#2a1a0c;
  --car:#60a5fa; --med:#fb7185; --life:#4ade80; --ind:#a78bfa;
  --up:#fb7185; --dn:#60a5fa; --warn:#fb923c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.hide { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
#themeBtn { position: fixed; top: 10px; right: 12px; z-index: 60; font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }

header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 4px 14px; padding: 14px 0 10px; }
body.toggle header { padding-right: 110px; }
header .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--navy); background: var(--navy-soft); padding: 2px 8px; border-radius: 99px; margin-bottom: 4px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; color: var(--navy); }
header h1 span { color: var(--accent); }
header .d { color: var(--ink2); font-size: 13px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card > h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; color: var(--navy); }
.card > h2 small { font-size: 12px; color: var(--ink3); font-weight: 500; }
.c-car { --c: var(--car); } .c-med { --c: var(--med); } .c-life { --c: var(--life); } .c-ind { --c: var(--ind); }
.catdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--c, var(--ink3)); }

/* ── 1단계: 개요 띠 ── */
.step { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--accent); margin: 0 0 6px; }
.strip { display: grid; grid-template-columns: minmax(0, 1fr) 270px; height: 118px; background: var(--strip); border: 1px solid var(--line); border-radius: 10px; }
.axbox { position: relative; }
.axis { position: relative; height: 100%; margin: 0 24px; }
.axis .base { position: absolute; left: 0; right: 0; top: 62px; height: 2px; background: var(--navy); opacity: .35; }
.axis .tk { position: absolute; top: 57px; width: 1px; height: 12px; background: var(--ink3); }
.axis .tl { position: absolute; top: 76px; transform: translateX(-50%); font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 11px; color: var(--ink3); white-space: nowrap; }
.axis .mon { position: absolute; top: 94px; font-size: 11px; font-weight: 700; color: var(--navy); opacity: .75; }
.axis .now { position: absolute; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; background: var(--today); }
.axis .now span { position: absolute; top: 0; left: 5px; font-size: 11px; font-weight: 800; color: var(--on-today); background: var(--today); padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.dot { position: absolute; top: 63px; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border: 0; background: transparent; cursor: pointer; z-index: 2; }
.dot::before { content: ""; position: absolute; left: 6px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--strip); transition: transform .15s; }
.dot .dl { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 800; color: var(--c); white-space: nowrap; }
.dot .tip { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: var(--navy); color: var(--panel); font: 500 12px/1.4 Pretendard, system-ui, sans-serif; text-align: left; white-space: normal; opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; z-index: 10; }
.dot .tip b { display: block; font-size: 11px; opacity: .8; }
.dot:hover .tip, .dot:focus-visible .tip { opacity: 1; visibility: visible; }
.dot:hover::before, .dot.on::before, .dot.peek::before, .dot:focus-visible::before { transform: scale(1.3); }
.dot.on::before { box-shadow: 0 0 0 3px var(--strip), 0 0 0 5px var(--accent); }
.dot:focus-visible { outline: none; }
.fzb { border-left: 2px dashed var(--fz); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border-radius: 0 10px 10px 0; background: var(--fz-soft); font: inherit; color: inherit; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; }
.fzb:hover .fzt, .fzb.on .fzt { text-decoration: underline; }
.fzb.on { box-shadow: inset 0 0 0 2px var(--fz); }
.fzt { font-size: 13px; font-weight: 800; color: var(--fz); }
.fzt small { font-weight: 500; color: var(--ink3); font-size: 11.5px; margin-left: 4px; }
.fzl { display: flex; flex-wrap: wrap; gap: 4px; }
.fzl span { font-size: 11.5px; padding: 2px 8px 2px 6px; border-radius: 99px; border: 1px dashed var(--c); background: var(--panel); color: var(--ink); white-space: nowrap; }
.fzl span i { font-style: normal; color: var(--ink3); }
.hint { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin: 7px 0 12px; }
.hint .lg { display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* ── 2단계: 레인 표 ── */
.lanes { display: grid; grid-template-columns: 138px minmax(0, 1fr) 34px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lanes > div { border-top: 1px solid var(--line); transition: opacity .2s; }
.lanes > .lh { border-top: 0; font-size: 11.5px; font-weight: 700; color: var(--ink3); background: var(--strip); padding: 6px 10px; }
.lanes > .lh.fzh { color: var(--fz); }
.lanes > .nowh { border-top: 0; background: var(--strip); color: var(--today); font-size: 10.5px; font-weight: 800; text-align: center; padding: 7px 0; }
.ln { padding: 8px 10px; border-left: 4px solid var(--c); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.ln b { font-size: 13.5px; color: var(--c); line-height: 1.25; }
.ln span { font-size: 11px; color: var(--ink3); }
.nowc { background: linear-gradient(var(--today), var(--today)) center / 2px 100% no-repeat; opacity: .55; }
.cell { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.li { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 0 8px; padding: 4px 8px; border-radius: 7px; border-left: 3px solid var(--c); background: var(--panel); transition: background .2s, box-shadow .2s; }
.li.fz { border-left: 3px dashed var(--fz); }
.li .w { font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 800; color: var(--ink2); line-height: 1.35; padding-top: 1px; }
.li .w i { display: block; font-style: normal; font-weight: 600; color: var(--ink3); font-size: 10.5px; }
.li.fz .w { font-family: Pretendard, system-ui, sans-serif; color: var(--fz); font-size: 12px; }
.li .t { font-size: 13px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .m { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li.hl { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cell .none { font-size: 12px; color: var(--ink3); padding: 0 8px; }
.dim { opacity: .25; }

/* ── 아래 영역 ── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 12px; }
.chip { font: inherit; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); }
.chip.on { background: var(--navy); border-color: var(--navy); color: var(--panel); font-weight: 700; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.sh { margin: 0 0 8px; font-size: 14px; color: var(--navy); display: flex; justify-content: space-between; align-items: baseline; }
.sh small { font-size: 12px; font-weight: 500; color: var(--ink3); }
.news { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; border-top: 3px solid var(--c); }
.item .top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink3); margin-bottom: 4px; flex-wrap: wrap; }
.item .cat { font-weight: 700; color: var(--c); }
.item h3 { margin: 0 0 6px; font-size: 15px; line-height: 1.4; }
.item p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.6; }
.item .srcs { margin-top: 8px; font-size: 12px; color: var(--ink3); }
.empty { font-size: 13px; color: var(--ink3); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; grid-column: 1 / -1; }
.side { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
.row:last-of-type { border-bottom: 0; }
.row .n { font-family: "JetBrains Mono", monospace; font-weight: 600; white-space: nowrap; }
.row .n.dt { font-weight: 400; color: var(--ink3); }
.row .off { flex: none; font-size: 11px; font-weight: 700; color: var(--panel); background: var(--navy); padding: 0 5px; border-radius: 4px; height: 17px; margin-top: 2px; }
.row .ot { flex: 1; }
.n.up { color: var(--up); } .n.dn { color: var(--dn); }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.status .w { color: var(--warn); font-weight: 600; }
footer { margin: 24px 0 0; padding: 16px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }

@media (max-width: 1000px) { .below { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .strip { grid-template-columns: 1fr; height: auto; }
  .axbox { height: 118px; overflow-x: auto; overflow-y: hidden; }
  .axis { min-width: 560px; }
  .fzb { border-left: 0; border-top: 2px dashed var(--fz); border-radius: 0 0 10px 10px; }
  .lanes { grid-template-columns: 1fr; }
  .lanes > .lh, .lanes > .nowh, .nowc { display: none; }
  .ln { flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 8px; background: var(--strip); }
  .li { grid-template-columns: 78px minmax(0, 1fr); }
  .cell::before { content: attr(data-h); font-size: 11px; font-weight: 700; color: var(--ink3); padding: 0 2px; }
  .cell.fzcell::before { color: var(--fz); }
  .lanes > .cell { border-top: 0; }
  .news { grid-template-columns: 1fr; }
  header h1 { font-size: 20px; }
}
</style>
</head>

  ['메리츠화재', '업무용', '-1', '2026-09-26'], ['메리츠화재', '영업용', '-1', '2026-09-26'], ['현대해상', '영업용', '0', '2026-09-21'],
  ['현대해상', '업무용', '0', '2026-06-16'], ['하나손보', '개인용', '0', '2026-06-08'], ['흥국화재', '개인용', '+1.4', '2026-03-13'],
  ['롯데손보', '개인용', '+1.4', '2026-03-01'], ['메리츠화재', '개인용', '+1.3', '2026-02-21'], ['한화손보', '개인용', '+1.2', '2026-02-21'],
];

const STATUS = [
  ['금융위원회', 'warn', 'RSS 점검 중(503) → 목록 페이지로 수집'], ['금융감독원', 'ok', ''], ['손해보험협회', 'ok', ''], ['손보협회 공시실', 'ok', ''],
  ['생명보험협회', 'ok', ''], ['보험연구원', 'ok', ''], ['보험사 4곳', 'ok', ''], ['보험 전문지 4곳', 'ok', '오늘 37건'],
];

// ── 도우미 ──
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = (d) => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
const dayDiff = (d) => Math.round((new Date(TODAY) - new Date(d)) / 86400000);
const dLabel = (c) => { const n = dayDiff(c.date); return n > 0 ? `D+${n}` : n === 0 ? 'D-DAY' : `D${n}`; };
const cc = (cat) => 'c-' + CK[cat];
const link = (o, tip) => `<a href="${esc(o.url)}" target="_blank" rel="noopener"${tip ? ` title="${esc(tip)}"` : ''}>${esc(o.title)}</a>`;
const srcLinks = (srcs) => srcs.map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ');
const sign = (v) => (v.startsWith('+') ? 'up' : v.startsWith('-') ? 'dn' : '');
const DISCLAIMER = '이 사이트는 공개된 보도자료와 기사를 자동으로 모아 보여 주는 정보 제공용이며, 보험 가입이나 해지를 권유하지 않습니다. 요약은 AI가 만들었으므로 정확한 내용은 반드시 원문과 약관에서 확인하세요.';

const LANES = CATS.slice(1);
const upcoming = CHANGES.filter((c) => !c.exact && !c.past);
const recent = CHANGES.filter((c) => c.exact || c.past);
const fuzzy = CHANGES.filter((c) => !c.exact);
const START = new Date('2026-09-01'), END = new Date('2026-10-31');
const pos = (d) => ((new Date(d) - START) / (END - START)) * 100;
const TICKS = ['2026-09-01', '2026-09-15', '2026-10-01', '2026-10-15', '2026-10-31'];
const idx = (c) => CHANGES.indexOf(c);

// ── 1단계: 개요 띠 ──
const stripHtml = () => {
  const ticks = TICKS.map((d) => `<div class="tk" style="left:${pos(d)}%"></div><div class="tl" style="left:${pos(d)}%">${md(d)}</div>`).join('');
  const dots = CHANGES.filter((c) => c.exact).map((c) => `<button type="button" class="dot ${cc(c.cat)}" data-i="${idx(c)}" data-cat="${esc(c.cat)}" style="left:${pos(c.date)}%" aria-label="${esc(md(c.date) + ' ' + c.title)}"><span class="dl">${md(c.date)}</span><span class="tip"><b>${md(c.date)} · ${dLabel(c)} · ${esc(c.cat)}</b>${esc(c.title)}</span></button>`).join('');
  return `<div class="strip">
      <div class="axbox"><div class="axis"><div class="base"></div>${ticks}
        <span class="mon" style="left:${pos('2026-09-01')}%">9월</span><span class="mon" style="left:${pos('2026-10-01')}%">10월</span>
        <div class="now" style="left:${pos(TODAY)}%"><span>오늘 ${md(TODAY)}</span></div>${dots}</div></div>
      <button type="button" class="fzb" id="fzb" aria-label="날짜 미확정 항목을 아래 표에서 강조">
        <span class="fzt">미확정 ${fuzzy.length}건<small>축에 찍지 않음 · 원문 표현</small></span>
        <span class="fzl">${fuzzy.map((c) => `<span class="${cc(c.cat)}" data-cat="${esc(c.cat)}"><span class="catdot"></span>${esc(c.when)}${c.past ? ' <i>(지난 일)</i>' : ''}</span>`).join('')}</span>
      </button>
    </div>`;
};

// ── 2단계: 레인 표 ──
const liHtml = (c) => c.exact
  ? `<div class="li ${cc(c.cat)}" data-i="${idx(c)}"><div class="w">${md(c.date)}<i>${dLabel(c)}</i></div><div><div class="t">${link(c, c.title)}</div><div class="m">${esc(c.raw)} · ${esc(c.src)}${c.note ? ' · ' + esc(c.note) : ''}</div></div></div>`
  : `<div class="li fz ${cc(c.cat)}" data-i="${idx(c)}"><div class="w">${esc(c.when)}${c.past ? '<i>(지난 일) · 미확정</i>' : '<i>날짜 미확정</i>'}</div><div><div class="t">${link(c, c.title)}</div><div class="m">${esc(c.raw)} · ${esc(c.src)}${c.pub ? ' ' + md(c.pub) + ' 발표' : ''}</div></div></div>`;
const laneRow = (cat) => {
  const past = recent.filter((c) => c.cat === cat), fut = upcoming.filter((c) => c.cat === cat);
  return `<div class="ln ${cc(cat)}" data-lane="${esc(cat)}"><b>${esc(cat)}</b><span>최근 시행 ${past.length} · 예정 ${fut.length}</span></div>
    <div class="cell" data-lane="${esc(cat)}" data-h="최근 시행">${past.length ? past.map(liHtml).join('') : '<span class="none">없음</span>'}</div>
    <div class="nowc" data-lane="${esc(cat)}"></div>
    <div class="cell fzcell" data-lane="${esc(cat)}" data-h="예정">${fut.length ? fut.map(liHtml).join('') : '<span class="none">없음</span>'}</div>`;
};
const lanesHtml = () => `<div class="lanes">
    <div class="lh"></div><div class="lh">최근 시행 · ${recent.length}건 (지난 미확정 포함)</div><div class="nowh">오늘</div><div class="lh fzh">예정 · ${upcoming.length}건</div>
    ${LANES.map(laneRow).join('')}
  </div>`;

// ── 아래 영역 ──
const chipsHtml = () => `<div class="chips" role="group" aria-label="보험 종류 필터">${CATS.map((c, i) => `<button type="button" class="chip${i ? '' : ' on'} ${i ? cc(c) : ''}" data-f="${esc(c)}">${i ? '<span class="catdot"></span>' : ''}${esc(c)}</button>`).join('')}</div>`;
const newsItem = (n) => `<div class="item ${cc(n.cat)}" data-cat="${esc(n.cat)}"><div class="top"><span class="cat"><span class="catdot"></span>${esc(n.cat)}</span>${n.srcs.length > 1 ? `· ${n.srcs.length}곳 보도` : ''}</div><h3>${esc(n.title)}</h3><p>${esc(n.sum.join(' '))}</p><div class="srcs">${srcLinks(n.srcs)}</div></div>`;
const officialRows = () => OFFICIAL.map((o) => `<div class="row ${cc(o.cat)}" data-cat="${esc(o.cat)}"><span class="off">공식</span><span class="ot"><span class="catdot"></span>${link(o)}<br><small style="color:var(--ink3)">${esc(o.src)} · ${esc(o.cat)}</small></span><span class="n dt">${md(o.day)}</span></div>`).join('');
const industryRows = () => INDUSTRY.map((i) => `<div class="row">${link(i)}<span class="n">${i.srcs}곳</span></div>`).join('');
const rateRows = () => RATES.map((r) => `<div class="row"><span>${esc(r[0])} · ${esc(r[1])}</span><span class="n ${sign(r[2])}">${md(r[3])} &nbsp; ${esc(r[2])}%</span></div>`).join('');
const statusHtml = () => `<div class="status">${STATUS.map((s) => `<span class="${s[1] === 'ok' ? '' : 'w'}">${s[1] === 'ok' ? '✓' : '⚠'} ${esc(s[0])}${s[2] ? ' · ' + esc(s[2]) : ''}</span>`).join('')}</div>`;

document.getElementById('app').innerHTML = `
  <header>
    <div><span class="tag">시안 v3-2 · 개요 띠 + 레인 상세</span><h1>보험 <span>레이더</span></h1></div>
    <div class="d">2026.10.23 (금) 09:00 갱신 · 새 소식 37 · 공식 발표 ${OFFICIAL.length}</div>
  </header>
  <section class="card" aria-label="바뀌는 것">
    <h2>바뀌는 것 <small>9.1 ~ 10.31 · 먼저 한눈에, 그다음 종류별로</small></h2>
    <div class="step">① 한눈에 보기</div>
    ${stripHtml()}
    <div class="hint"><span class="lg"><span><span class="catdot c-car"></span>자동차</span><span><span class="catdot c-med"></span>실손</span><span><span class="catdot c-life"></span>생명·건강·상해</span><span><span class="catdot c-ind"></span>제도·공통</span></span><span>점에 마우스를 올리면 제목, 누르면 아래 표에서 강조됩니다</span></div>
    <div class="step">② 보험 종류별로 보기</div>
    ${lanesHtml()}
  </section>
  ${chipsHtml()}
  <div class="below">
    <section><h2 class="sh">오늘 소식 <small>${NEWS.length}개 주제</small></h2><div class="news" data-list>${NEWS.map(newsItem).join('')}<div class="empty hide">이 종류의 소식이 없습니다</div></div></section>
    <aside class="side">
      <div class="card"><h2>공식 발표 <small>정부·감독기관</small></h2><div data-list>${officialRows()}<div class="empty hide">이 종류의 발표가 없습니다</div></div></div>
      <div class="card"><h2>자동차보험료 조정 <small>손보협회 공시실</small></h2>${rateRows()}</div>
      <div class="card"><h2>업계 동향</h2>${industryRows()}</div>
      <div class="card"><h2>수집 상태</h2>${statusHtml()}</div>
    </aside>
  </div>
  <footer>${DISCLAIMER}</footer>`;

// 좁은 화면에서는 띠를 오늘 쪽으로 미리 옮겨 둔다
const axbox = document.querySelector(".axbox"); axbox.scrollLeft = axbox.scrollWidth;

// ── 띠 ↔ 표 연결 ──
const clearHl = () => { document.querySelectorAll('.li.hl, .dot.on, .fzb.on').forEach((el) => el.classList.remove('hl', 'on')); };
const reveal = (el) => { if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
document.addEventListener('click', (e) => {
  const dot = e.target.closest('.dot');
  if (dot) {
    const was = dot.classList.contains('on');
    clearHl();
    if (!was) { dot.classList.add('on'); const li = document.querySelector(`.li[data-i="${dot.dataset.i}"]`); if (li) { li.classList.add('hl'); reveal(li); } }
    return;
  }
  const fzb = e.target.closest('.fzb');
  if (fzb) {
    const was = fzb.classList.contains('on');
    clearHl();
    if (!was) { fzb.classList.add('on'); const els = document.querySelectorAll('.li.fz'); els.forEach((li) => li.classList.add('hl')); reveal(els[0]); }
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    const f = chip.dataset.f, all = f === '전체';
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
    document.querySelectorAll('.below [data-cat]').forEach((el) => el.classList.toggle('hide', !all && el.dataset.cat !== f));
    document.querySelectorAll('.lanes [data-lane]').forEach((el) => el.classList.toggle('dim', !all && el.dataset.lane !== f));
    document.querySelectorAll('.strip [data-cat]').forEach((el) => el.classList.toggle('dim', !all && el.dataset.cat !== f));
    document.querySelectorAll('.below [data-list]').forEach((l) => {
      const any = [...l.querySelectorAll('[data-cat]')].some((el) => !el.classList.contains('hide'));
      l.querySelector('.empty').classList.toggle('hide', any);
    });
  }
});
document.addEventListener('mouseover', (e) => {
  const li = e.target.closest('.li');
  document.querySelectorAll('.dot.peek').forEach((d) => d.classList.remove('peek'));
  if (li) { const d = document.querySelector(`.dot[data-i="${li.dataset.i}"]`); if (d) d.classList.add('peek'); }
});

// ── 테마 ──
const q = new URLSearchParams(location.search).get('theme');
if (q === 'dark' || q === 'light') document.documentElement.dataset.theme = q;
addEventListener('message', (e) => { if (e.data && e.data.type === 'theme') document.documentElement.dataset.theme = e.data.theme; });
if (window.top === window) {
  const btn = document.getElementById('themeBtn');
  const sync = () => { btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
  btn.classList.remove('hide'); document.body.classList.add('toggle'); sync();
  btn.onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; sync(); };
}
</script>

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 레이더 시안 v3 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --page:#e9ebf0; --bar:#1f2430; --bar-ink:#ffffff; --btn-line:#4a5263; --btn-ink:#cfd6e4; --on-bg:#ffffff; --on-ink:#1f2430; --note:#9aa4b8; --miss-bg:#ffffff; --miss-ink:#334155; --miss-ink2:#64748b; --miss-line:#d5dae3; }
[data-theme="dark"] { --page:#0b0d12; --bar:#12151c; --bar-ink:#e8ecf3; --btn-line:#3a4152; --btn-ink:#c3cbda; --on-bg:#e8ecf3; --on-ink:#12151c; --note:#8f9ab0; --miss-bg:#151922; --miss-ink:#dbe2ee; --miss-ink2:#94a0b6; --miss-line:#2a3140; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; font-family: Pretendard, system-ui, sans-serif; background: var(--page); -webkit-font-smoothing: antialiased; }
.bar { flex: none; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bar); color: var(--bar-ink); font-size: 13px; }
.bar b { font-weight: 700; margin-right: 6px; }
.bar .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.bar button { font: inherit; border: 1px solid var(--btn-line); background: transparent; color: var(--btn-ink); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.bar button.on { background: var(--on-bg); color: var(--on-ink); border-color: var(--on-bg); font-weight: 700; }
.bar button:focus-visible { outline: 2px solid #5eead4; outline-offset: 2px; }
.bar .sp { flex: 1; }
.bar .note { color: var(--note); font-size: 12px; width: 100%; }
.stage { position: relative; flex: 1; min-height: 0; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--page); }
.miss { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--page); }
.miss[hidden] { display: none; }
.miss div { max-width: 420px; background: var(--miss-bg); color: var(--miss-ink); border: 1px solid var(--miss-line); border-radius: 12px; padding: 18px 20px; font-size: 14px; line-height: 1.6; }
.miss small { color: var(--miss-ink2); font-size: 12.5px; }
</style>
</head>
<body>
<div class="bar">
  <b>보험 레이더 · 시안 v3 (2+3 결합)</b>
  <div class="tabs" id="tabs" role="tablist" aria-label="시안 선택"></div>
  <span class="sp"></span>
  <button id="theme" type="button">☾ 다크</button>
  <div class="note">2026-10-23에 실제로 수집한 제목·날짜·출처를 넣었습니다. 요약 문장은 원문 첫 문단에서 옮긴 시안용 예시입니다.</div>
</div>
<div class="stage">
  <iframe id="view" title="시안 미리보기"></iframe>
  <div class="miss" id="miss" hidden><div><b id="missName"></b> 파일이 아직 없습니다.<br><small>다른 시안을 먼저 보거나, 파일이 만들어진 뒤 이 탭을 다시 누르세요.</small></div></div>
</div>
<script>
const NAMES = { 1: '1 · 레인 타임라인', 2: '2 · 개요 띠 + 레인 상세', 3: '3 · 주간 매트릭스', 4: '4 · 레인 가로 카드 줄', 5: '5 · 종류별 타일' };
const KEY = 'ir-mock3-tab';
const tabs = document.getElementById('tabs'), view = document.getElementById('view'), miss = document.getElementById('miss');
const themeBtn = document.getElementById('theme');
let theme = 'light', cur = '1', seq = 0;

const sendTheme = () => { try { view.contentWindow.postMessage({ type: 'theme', theme }, '*'); } catch (e) {} };
view.addEventListener('load', sendTheme);

const show = (k) => {
  cur = k;
  tabs.querySelectorAll('button').forEach((b) => { const on = b.dataset.k === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
  const url = `${k}.html?theme=${theme}`;
  view.src = url;
  try { localStorage.setItem(KEY, k); } catch (e) {}
  // 파일이 없을 때 안내 (http로 열었을 때만 확인, file://에서는 그냥 iframe을 보여 줌)
  miss.hidden = true;
  const my = ++seq;
  if (location.protocol.startsWith('http')) {
    fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then((r) => { if (my === seq && !r.ok) { document.getElementById('missName').textContent = `${NAMES[k]} (${k}.html)`; miss.hidden = false; } })
      .catch(() => {});
  }
};

Object.entries(NAMES).forEach(([k, n]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.k = k; b.textContent = n; b.setAttribute('role', 'tab');
  b.onclick = () => show(k);
  tabs.appendChild(b);
});

const setTheme = (t) => {
  theme = t;
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀ 밝은 모드' : '☾ 다크';
  sendTheme();
};
themeBtn.onclick = () => setTheme(theme === 'dark' ? 'light' : 'dark');
setTheme('light');

let saved = '1';
try { saved = localStorage.getItem(KEY) || '1'; } catch (e) {}
show(NAMES[saved] ? saved : '1');
</script>
</body>
</html>

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 레이더 시안 v4-3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f4f8; --panel:#ffffff; --ink:#111c33; --ink2:#3c4862; --ink3:#5a6680; --line:#dce2ec;
  --navy:#1f3561; --navy-soft:#e9eef7; --strip:#f5f7fb;
  --accent:#0f8a80; --accent-soft:#d5f3ef; --on-accent:#ffffff;
  --today:#dc2626; --on-today:#ffffff;
  --fz:#c2410c; --fz-soft:#fff3ea;
  --car:#2563eb; --med:#e11d48; --life:#16a34a; --ind:#7c3aed;
  --up:#e11d48; --dn:#2563eb; --warn:#c2410c;
  --radius:12px;
}
[data-theme="dark"] {
  --bg:#0a0f1c; --panel:#111a2d; --ink:#e4e9f4; --ink2:#aab5cb; --ink3:#8592ad; --line:#24324f;
  --navy:#b8c8ea; --navy-soft:#1a2642; --strip:#0d1525;
  --accent:#2dd4bf; --accent-soft:#0d3a3a; --on-accent:#03201c;
  --today:#fb7185; --on-today:#2a070d;
  --fz:#fb923c; --fz-soft:#2a1a0c;
  --car:#60a5fa; --med:#fb7185; --life:#4ade80; --ind:#a78bfa;
  --up:#fb7185; --dn:#60a5fa; --warn:#fb923c;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Pretendard, system-ui, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.hide { display: none !important; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
#themeBtn { position: absolute; top: 10px; right: 12px; z-index: 60; font: inherit; font-size: 12.5px; padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }

header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 4px 14px; padding: 10px 0 8px; }
body.toggle header { padding-right: 110px; }
header .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--navy); background: var(--navy-soft); padding: 2px 8px; border-radius: 99px; margin-bottom: 3px; }
header h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; color: var(--navy); }
header h1 span { color: var(--accent); }
header .d { color: var(--ink2); font-size: 13px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card > h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; color: var(--navy); }
.card > h2 small { font-size: 12px; color: var(--ink3); font-weight: 500; }
.c-car { --c: var(--car); } .c-med { --c: var(--med); } .c-life { --c: var(--life); } .c-ind { --c: var(--ind); }
.catdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--c, var(--ink3)); }
.new { display: inline-block; font: 800 10.5px/1 Pretendard, system-ui, sans-serif; padding: 3px 6px; border-radius: 99px; background: var(--accent); color: var(--on-accent); vertical-align: 1px; margin-right: 5px; white-space: nowrap; }

/* ── 0단계: 우리 집 보험 ── */
.mine { padding: 10px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--accent); }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.mrow .ml { font-size: 13px; font-weight: 800; color: var(--navy); margin-right: 4px; }
.tg { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 7px; border-radius: 99px; border: 1.5px dashed var(--line); background: var(--panel); color: var(--ink3); cursor: pointer; }
.tg .bx { flex: none; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--c); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; line-height: 1; color: transparent; }
.tg[aria-pressed="true"] { border: 1.5px solid var(--c); color: var(--ink); font-weight: 700; }
.tg[aria-pressed="true"] .bx { background: var(--c); color: var(--panel); }
.tg:focus-visible, .mini:focus-visible, .dot:focus-visible::before, .fzb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.local { font-size: 11.5px; color: var(--ink3); margin-left: 4px; }
.mrow2 { justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 8px; }
.sum { margin: 0; font-size: 15px; font-weight: 800; color: var(--navy); letter-spacing: -.01em; }
.sum small { font-size: 12.5px; font-weight: 500; color: var(--ink3); }
.visit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12.5px; color: var(--ink2); }
.visit b { color: var(--accent); }
.mini { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink3); cursor: pointer; }
.mini:hover { color: var(--ink); border-color: var(--ink3); }

/* ── 1단계: 개요 띠 ── */
.stripwrap { display: flex; flex-direction: column; gap: 6px; }
.strip { display: grid; grid-template-columns: minmax(0, 1fr) 270px; height: 112px; background: var(--strip); border: 1px solid var(--line); border-radius: 10px; }
.axbox { position: relative; }
.axis { position: relative; height: 100%; margin: 0 24px; }
.axis .base { position: absolute; left: 0; right: 0; top: 60px; height: 2px; background: var(--navy); opacity: .35; }
.axis .tk { position: absolute; top: 55px; width: 1px; height: 12px; background: var(--ink3); }
.axis .tl { position: absolute; top: 73px; transform: translateX(-50%); font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 11px; color: var(--ink3); white-space: nowrap; }
.axis .mon { position: absolute; top: 90px; font-size: 11px; font-weight: 700; color: var(--navy); opacity: .75; }
.axis .now { position: absolute; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; background: var(--today); }
.axis .now span { position: absolute; top: 0; left: 5px; font-size: 11px; font-weight: 800; color: var(--on-today); background: var(--today); padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.dot { position: absolute; top: 61px; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border: 0; background: transparent; cursor: pointer; z-index: 2; transition: opacity .2s; }
.dot::before { content: ""; position: absolute; left: 6px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--strip); transition: transform .15s; }
.dot .dl { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 800; color: var(--c); white-space: nowrap; }
.dot .dl em { font: 800 10px/1 Pretendard, system-ui, sans-serif; margin-left: 3px; padding: 1px 4px; border-radius: 99px; background: var(--accent); color: var(--on-accent); }
.dot:hover::before, .dot.on::before, .dot.peek::before, .dot.cur::before, .dot:focus-visible::before { transform: scale(1.3); }
.dot.on::before { box-shadow: 0 0 0 3px var(--strip), 0 0 0 5px var(--accent); }
.dot:focus-visible { outline: none; }
.dot.faint { opacity: .35; }
.dot.faint:hover, .dot.faint.on, .dot.faint.cur { opacity: .8; }
.fzb { border-left: 2px dashed var(--fz); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border-radius: 0 10px 10px 0; background: var(--fz-soft); font: inherit; color: inherit; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; }
.fzb:hover .fzt, .fzb.on .fzt { text-decoration: underline; }
.fzb.on { box-shadow: inset 0 0 0 2px var(--fz); }
.fzt { font-size: 13px; font-weight: 800; color: var(--fz); }
.fzt small { font-weight: 500; color: var(--ink3); font-size: 11.5px; margin-left: 4px; }
.fzl { display: flex; flex-wrap: wrap; gap: 4px; }
.fzl > span { font-size: 11.5px; padding: 2px 8px 2px 6px; border-radius: 99px; border: 1px dashed var(--c); background: var(--panel); color: var(--ink); white-space: nowrap; transition: opacity .2s; }
.fzl > span i { font-style: normal; color: var(--ink3); }
.fzl > span .new { font-size: 9.5px; padding: 2px 4px; margin: 0 0 0 4px; }
.fzl > span.faint { opacity: .4; }
/* 말풍선 대신: 띠 아래 고정 안내 줄 */
.info { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; line-height: 1.4; }
.info.idle { border-style: dashed; color: var(--ink3); font-size: 12.5px; justify-content: space-between; flex-wrap: wrap; gap: 2px 14px; }
.info .lg { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--ink2); }
.info .k { flex: none; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 12px; color: var(--c, var(--fz)); white-space: nowrap; }
.info .tt { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .tt a { font-weight: 700; }
.info .mm { color: var(--ink3); font-size: 12px; }
.info .catdot { flex: none; margin-right: 0; }

/* ── 2단계: 레인 표 ── */
.lanes { display: grid; grid-template-columns: 138px minmax(0, 1fr) 34px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 10px; }
.lanes > div { border-top: 1px solid var(--line); transition: opacity .2s; }
.lanes > .lh { border-top: 0; font-size: 11.5px; font-weight: 700; color: var(--ink3); background: var(--strip); padding: 6px 10px; }
.lanes > .lh.fzh { color: var(--fz); }
.lanes > .nowh { border-top: 0; background: var(--strip); color: var(--today); font-size: 10.5px; font-weight: 800; text-align: center; padding: 7px 0; }
.lanes > .offtop { border-top: 2px dashed var(--ink3); }
.ln { padding: 8px 10px; border-left: 4px solid var(--c); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.ln b { font-size: 13.5px; color: var(--c); line-height: 1.25; }
.ln span { font-size: 11px; color: var(--ink3); }
.nowc { background: linear-gradient(var(--today), var(--today)) center / 2px 100% no-repeat; opacity: .55; }
.cell { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.li { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 0 8px; padding: 4px 8px; border-radius: 7px; border-left: 3px solid var(--c); background: var(--panel); transition: background .2s, box-shadow .2s; }
.li.fz { border-left: 3px dashed var(--fz); }
.li .w { font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 800; color: var(--ink2); line-height: 1.35; padding-top: 1px; }
.li .w i { display: block; font-style: normal; font-weight: 600; color: var(--ink3); font-size: 10.5px; }
.li.fz .w { font-family: Pretendard, system-ui, sans-serif; color: var(--fz); font-size: 12px; }
.li .t { font-size: 13px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .m { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li.hl { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.cell .none { font-size: 12px; color: var(--ink3); padding: 0 8px; }
.lanes > .faint { opacity: .42; }
.lanes > .faint:hover, .lanes > .faint:focus-within { opacity: .85; }
.lanes > .nowc.faint { opacity: .2; }
.dim, .lanes > .dim, .dot.dim, .fzl > span.dim { opacity: .2; }

/* ── 아래 영역 ── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 12px; }
.chip { font: inherit; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); }
.chip.on { background: var(--navy); border-color: var(--navy); color: var(--panel); font-weight: 700; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.sh { margin: 0 0 8px; font-size: 14px; color: var(--navy); display: flex; justify-content: space-between; align-items: baseline; }
.sh small { font-size: 12px; font-weight: 500; color: var(--ink3); }
.news { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; border-top: 3px solid var(--c); }
.item .top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink3); margin-bottom: 4px; flex-wrap: wrap; }
.item .cat { font-weight: 700; color: var(--c); }
.item h3 { margin: 0 0 6px; font-size: 15px; line-height: 1.4; }
.item p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.6; }
.item .srcs { margin-top: 8px; font-size: 12px; color: var(--ink3); }
.empty { font-size: 13px; color: var(--ink3); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; grid-column: 1 / -1; }
.side { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
.row:last-of-type { border-bottom: 0; }
.row .n { font-family: "JetBrains Mono", monospace; font-weight: 600; white-space: nowrap; }
.row .n.dt { font-weight: 400; color: var(--ink3); }
.row .off { flex: none; font-size: 11px; font-weight: 700; color: var(--panel); background: var(--navy); padding: 0 5px; border-radius: 4px; height: 17px; margin-top: 2px; }
.row .ot { flex: 1; }
.n.up { color: var(--up); } .n.dn { color: var(--dn); }
.status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.status .w { color: var(--warn); font-weight: 600; }
footer { margin: 24px 0 0; padding: 16px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }

@media (max-width: 1000px) { .below { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .strip { grid-template-columns: 1fr; height: auto; }
  .axbox { height: 112px; overflow-x: auto; overflow-y: hidden; }
  .axis { min-width: 560px; }
  .fzb { border-left: 0; border-top: 2px dashed var(--fz); border-radius: 0 0 10px 10px; }
  .info { align-items: flex-start; flex-wrap: wrap; min-height: 54px; }
  .info .tt { flex-basis: 100%; white-space: normal; }
  .lanes { grid-template-columns: 1fr; }
  .lanes > .lh, .lanes > .nowh, .nowc { display: none; }
  .ln { flex-direction: row; justify-content: flex-start; align-items: baseline; gap: 8px; background: var(--strip); }
  .li { grid-template-columns: 78px minmax(0, 1fr); }
  .cell::before { content: attr(data-h); font-size: 11px; font-weight: 700; color: var(--ink3); padding: 0 2px; }
  .cell.fzcell::before { color: var(--fz); }
  .lanes > .cell { border-top: 0; }
  .news { grid-template-columns: 1fr; }
  header h1 { font-size: 20px; }
  .mrow .ml { flex-basis: 100%; }
  .local { flex-basis: 100%; margin-left: 0; }
  .sum { font-size: 14px; }
}
</style>
</head>

  const on = LANES.filter(isSel), off = LANES.filter((c) => !isSel(c));
  return `<div class="lanes">
    <div class="lh"></div><div class="lh">최근 시행 · ${recent.length}건 (지난 미확정 포함)</div><div class="nowh">오늘</div><div class="lh fzh">예정 · ${upcoming.length}건</div>
    ${on.map((c) => laneRow(c, false)).join('')}${off.map((c, i) => laneRow(c, i === 0 && on.length > 0)).join('')}
  </div>`;
};

// ── 아래 영역 ──
const chipsHtml = () => `<div class="chips" role="group" aria-label="보험 종류 필터">${CATS.map((c, i) => `<button type="button" class="chip${c === state.filter ? ' on' : ''} ${i ? cc(c) : ''}" data-f="${esc(c)}" aria-pressed="${c === state.filter}">${i ? '<span class="catdot"></span>' : ''}${esc(c)}</button>`).join('')}</div>`;
const newsItem = (n) => `<div class="item ${cc(n.cat)}" data-cat="${esc(n.cat)}"><div class="top"><span class="cat"><span class="catdot"></span>${esc(n.cat)}</span>${n.srcs.length > 1 ? `· ${n.srcs.length}곳 보도` : ''}</div><h3>${esc(n.title)}</h3><p>${esc(n.sum.join(' '))}</p><div class="srcs">${srcLinks(n.srcs)}</div></div>`;
const officialRows = () => OFFICIAL.map((o) => `<div class="row ${cc(o.cat)}" data-cat="${esc(o.cat)}"><span class="off">공식</span><span class="ot"><span class="catdot"></span>${isNew(o.day) ? NEW : ''}${link(o)}<br><small style="color:var(--ink3)">${esc(o.src)} · ${esc(o.cat)}</small></span><span class="n dt">${md(o.day)}</span></div>`).join('');
const industryRows = () => INDUSTRY.map((i) => `<div class="row">${link(i)}<span class="n">${i.srcs}곳</span></div>`).join('');
const rateRows = () => RATES.map((r) => `<div class="row"><span>${esc(r[0])} · ${esc(r[1])}</span><span class="n ${sign(r[2])}">${md(r[3])} &nbsp; ${esc(r[2])}%</span></div>`).join('');
const statusHtml = () => `<div class="status">${STATUS.map((s) => `<span class="${s[1] === 'ok' ? '' : 'w'}">${s[1] === 'ok' ? '✓' : '⚠'} ${esc(s[0])}${s[2] ? ' · ' + esc(s[2]) : ''}</span>`).join('')}</div>`;

// ── 그리기 (설정이 바뀌면 다시 그림) ──
const app = document.getElementById('app');
const applyFilter = () => {
  const f = state.filter, all = f === '전체';
  document.querySelectorAll('.below [data-cat]').forEach((el) => el.classList.toggle('hide', !all && el.dataset.cat !== f));
  document.querySelectorAll('.lanes [data-lane]').forEach((el) => el.classList.toggle('dim', !all && el.dataset.lane !== f));
  document.querySelectorAll('.strip [data-cat]').forEach((el) => el.classList.toggle('dim', !all && el.dataset.cat !== f));
  document.querySelectorAll('.below [data-list]').forEach((l) => {
    const any = [...l.querySelectorAll('[data-cat]')].some((el) => !el.classList.contains('hide'));
    l.querySelector('.empty').classList.toggle('hide', any);
  });
};
const applyPin = (scroll) => {
  document.querySelectorAll('.li.hl, .dot.on, .fzb.on').forEach((el) => el.classList.remove('hl', 'on'));
  let first = null;
  if (typeof state.pin === 'number') {
    const d = document.querySelector(`.dot[data-i="${state.pin}"]`); if (d) d.classList.add('on');
    first = document.querySelector(`.li[data-i="${state.pin}"]`); if (first) first.classList.add('hl');
  } else if (state.pin === 'fz') {
    document.getElementById('fzb').classList.add('on');
    const els = document.querySelectorAll('.li.fz'); els.forEach((li) => li.classList.add('hl')); first = els[0];
  }
  if (scroll && first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};
const FOCUS_KEYS = ['mine', 'visit', 'f', 'i'];
const render = () => {
  const ax = document.querySelector('.axbox'), axLeft = ax ? ax.scrollLeft : null;
  const a = document.activeElement, fk = a && a.dataset ? FOCUS_KEYS.find((k) => a.dataset[k] !== undefined) : null, fv = fk ? a.dataset[fk] : null;
  app.innerHTML = `
  <header>
    <div><span class="tag">시안 v4-3 · 우리 집 보험 맞춤</span><h1>보험 <span>레이더</span></h1></div>
    <div class="d">2026.10.23 (금) 09:00 갱신 · 새 소식 37 · 공식 발표 ${OFFICIAL.length}</div>
  </header>
  ${mineHtml()}
  <section class="card" aria-label="바뀌는 것">
    <h2>바뀌는 것 <small>9.1 ~ 10.31 · ① 띠로 한눈에 → ② 표에서 종류별로 · 우리 집 보험은 진하게, 나머지는 옅게</small></h2>
    ${stripHtml()}
    ${lanesHtml()}
  </section>
  ${chipsHtml()}
  <div class="below">
    <section><h2 class="sh">오늘 소식 <small>${NEWS.length}개 주제</small></h2><div class="news" data-list>${NEWS.map(newsItem).join('')}<div class="empty hide">이 종류의 소식이 없습니다</div></div></section>
    <aside class="side">
      <div class="card"><h2>공식 발표 <small>정부·감독기관</small></h2><div data-list>${officialRows()}<div class="empty hide">이 종류의 발표가 없습니다</div></div></div>
      <div class="card"><h2>자동차보험료 조정 <small>손보협회 공시실</small></h2>${rateRows()}</div>
      <div class="card"><h2>업계 동향</h2>${industryRows()}</div>
      <div class="card"><h2>수집 상태</h2>${statusHtml()}</div>
    </aside>
  </div>
  <footer>${DISCLAIMER}</footer>`;
  // 좁은 화면에서는 띠를 오늘 쪽으로 미리 옮겨 둔다 (다시 그릴 때는 위치 유지)
  const nax = document.querySelector('.axbox'); nax.scrollLeft = axLeft == null ? nax.scrollWidth : axLeft;
  applyFilter(); applyPin(false);
  infoKey = undefined; setInfo(state.pin);
  if (fk) { const el = [...document.querySelectorAll(`[data-${fk}]`)].find((x) => x.dataset[fk] === fv); if (el) el.focus({ preventScroll: true }); }
};
// 테마 쿼리는 그리기 전에 적용 (라이트→다크 전환 애니메이션이 보이지 않게)
const q = new URLSearchParams(location.search).get('theme');
if (q === 'dark' || q === 'light') document.documentElement.dataset.theme = q;
render();

// ── 동작 ──
document.addEventListener('click', (e) => {
  const tg = e.target.closest('.tg');
  if (tg) { const c = tg.dataset.mine; if (mine.has(c)) mine.delete(c); else mine.add(c); saveMine(); render(); return; }
  const vb = e.target.closest('[data-visit]');
  if (vb) {
    const v = vb.dataset.visit;
    if (v === 'clear') { store.del('localStorage', K_VISIT); setVisit({ prev: null, sim: '' }); }
    else setVisit({ prev: shiftDay(TODAY, -Number(v)), sim: v === '1' ? '어제' : '일주일 전' });
    render(); return;
  }
  const dot = e.target.closest('.dot');
  if (dot) { const i = Number(dot.dataset.i); state.pin = state.pin === i ? null : i; applyPin(true); setInfo(state.pin == null ? i : state.pin); return; }
  const fzb = e.target.closest('.fzb');
  if (fzb) { state.pin = state.pin === 'fz' ? null : 'fz'; applyPin(true); setInfo('fz'); return; }
  const chip = e.target.closest('.chip');
  if (chip) {
    state.filter = chip.dataset.f;
    document.querySelectorAll('.chip').forEach((c) => { c.classList.toggle('on', c === chip); c.setAttribute('aria-pressed', String(c === chip)); });
    applyFilter();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.pin != null) { state.pin = null; applyPin(false); setInfo(null); } });
// 가리키면 안내 줄에 표시, 띠·안내 줄 영역을 벗어나면 고정한 항목(없으면 범례)으로 돌아감
const pointAt = (t) => { const d = t.closest && t.closest('.dot'); if (d) return Number(d.dataset.i); if (t.closest && t.closest('.fzb')) return 'fz'; return undefined; };
document.addEventListener('mouseover', (e) => {
  const li = e.target.closest('.li');
  document.querySelectorAll('.dot.peek').forEach((d) => d.classList.remove('peek'));
  if (li) { const d = document.querySelector(`.dot[data-i="${li.dataset.i}"]`); if (d) d.classList.add('peek'); }
  const k = pointAt(e.target); if (k !== undefined) setInfo(k);
});
document.addEventListener('mouseout', (e) => {
  const w = e.target.closest && e.target.closest('.stripwrap');
  if (w && !(e.relatedTarget && w.contains(e.relatedTarget))) setInfo(state.pin);
});
document.addEventListener('focusin', (e) => { const k = pointAt(e.target); if (k !== undefined) setInfo(k); });
document.addEventListener('focusout', (e) => {
  const w = e.target.closest && e.target.closest('.stripwrap');
  if (w && !(e.relatedTarget && w.contains(e.relatedTarget))) setInfo(state.pin);
});

// ── 테마 ──
addEventListener('message', (e) => { if (e.data && e.data.type === 'theme') document.documentElement.dataset.theme = e.data.theme; });
if (window.top === window) {
  const btn = document.getElementById('themeBtn');
  const sync = () => { btn.textContent = document.documentElement.dataset.theme === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
  btn.classList.remove('hide'); document.body.classList.add('toggle'); sync();
  btn.onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; sync(); };
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 레이더 시안 v1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── 시안 공통 틀 (실제 사이트 화면 아님) ── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Pretendard, system-ui, sans-serif; background: #e9ebf0; color: #111; -webkit-font-smoothing: antialiased; }
[data-theme="dark"] body { background: #0b0d12; color: #eee; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #1f2430; color: #fff; font-size: 13px; }
.bar b { font-weight: 700; margin-right: 6px; }
.bar .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.bar button { font: inherit; border: 1px solid #4a5263; background: transparent; color: #cfd6e4; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.bar button.on { background: #fff; color: #1f2430; border-color: #fff; font-weight: 700; }
.bar .sp { flex: 1; }
.bar .note { color: #9aa4b8; font-size: 12px; width: 100%; }
.design { display: none; min-height: 100vh; }
.design.on { display: block; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { cursor: pointer; user-select: none; }
.hide { display: none !important; }

/* ═════════ A · 아침 브리핑 (신문형) ═════════ */
.dA { --bg:#f6f1e7; --paper:#fbf8f1; --ink:#1b1a17; --ink2:#4a463e; --ink3:#857f72; --rule:#1b1a17; --soft:#d9d1bf; --accent:#a3281e; --tag:#efe7d6; --up:#a3281e; --down:#1f5f8b;
  background: var(--bg); color: var(--ink); }
[data-theme="dark"] .dA { --bg:#16140f; --paper:#1d1a14; --ink:#f0e9da; --ink2:#c9bfab; --ink3:#8e8572; --rule:#e9dfc9; --soft:#3a3428; --accent:#ff7b6b; --tag:#2a251c; --up:#ff8f80; --down:#7fbfe8; }
.dA .mast { text-align: center; padding: 26px 0 10px; border-bottom: 3px double var(--rule); }
.dA .mast .kick { font-size: 12px; letter-spacing: .3em; color: var(--ink3); }
.dA .mast h1 { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: clamp(34px, 6vw, 58px); margin: 6px 0 2px; letter-spacing: -.02em; }
.dA .mast .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 6px; }
.dA .ribbon { margin: 18px 0; border: 1px solid var(--rule); background: var(--paper); }
.dA .ribbon h2 { margin: 0; padding: 8px 12px; font-family: "Noto Serif KR", serif; font-size: 16px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
.dA .ribbon h2 small { font-family: Pretendard; font-weight: 400; font-size: 12px; color: var(--ink3); }
.dA .track { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.dA .tk { padding: 12px; border-right: 1px solid var(--soft); border-bottom: 1px solid var(--soft); }
.dA .tk .when { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 20px; }
.dA .tk .when.fuzzy { color: var(--accent); }
.dA .tk .raw { font-size: 11.5px; color: var(--ink3); margin: 2px 0 6px; }
.dA .tk .t { font-size: 14px; font-weight: 600; line-height: 1.4; }
.dA .tk .s { font-size: 11.5px; color: var(--ink2); margin-top: 6px; }
.dA .tk.past { opacity: .8; }
.dA .tk.past .when { font-size: 16px; }
.dA .chips { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.dA .chip { font-size: 13px; padding: 3px 10px; border: 1px solid var(--ink3); border-radius: 2px; }
.dA .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dA .cols { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0; margin-top: 14px; }
.dA .col { padding: 0 16px; border-left: 1px solid var(--soft); }
.dA .col:first-child { padding-left: 0; border-left: 0; }
.dA .col h3 { font-family: "Noto Serif KR", serif; font-size: 13px; letter-spacing: .15em; border-bottom: 2px solid var(--rule); padding-bottom: 4px; margin: 0 0 10px; }
.dA .lead h4 { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
.dA .art { padding: 10px 0; border-bottom: 1px solid var(--soft); }
.dA .art h4 { font-family: "Noto Serif KR", serif; font-size: 17px; line-height: 1.35; margin: 0 0 6px; }
.dA .art p { margin: 0 0 6px; font-size: 14px; line-height: 1.6; color: var(--ink2); }
.dA .src { font-size: 11.5px; color: var(--ink3); }
.dA .tag { display: inline-block; font-size: 11px; background: var(--tag); padding: 1px 6px; margin-right: 6px; color: var(--ink2); }
.dA .grp { font-size: 11.5px; color: var(--accent); font-weight: 700; }
.dA .mini { padding: 8px 0; border-bottom: 1px dotted var(--soft); font-size: 13.5px; line-height: 1.45; }
.dA .mini .src { display: block; margin-top: 2px; }
.dA .rate { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dA .rate td { padding: 5px 0; border-bottom: 1px dotted var(--soft); }
.dA .rate .n { text-align: right; font-family: "JetBrains Mono", monospace; font-weight: 600; }
.dA .foot { margin-top: 26px; padding: 14px 0 40px; border-top: 3px double var(--rule); font-size: 12px; color: var(--ink3); line-height: 1.7; }
@media (max-width: 860px) { .dA .cols { grid-template-columns: 1fr; } .dA .col { padding: 0; border-left: 0; margin-top: 14px; } }

/* ═════════ B · 타임라인 ═════════ */
.dB { --bg:#f7f8fa; --panel:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0; --accent:#2563eb; --accent-soft:#dbeafe; --today:#ef4444; --past:#cbd5e1; --fuzzy:#f59e0b; --fuzzy-soft:#fef3c7;
  background: var(--bg); color: var(--ink); }
[data-theme="dark"] .dB { --bg:#0b1120; --panel:#111a2e; --ink:#e2e8f0; --ink2:#a3b1c6; --ink3:#64748b; --line:#1e2a44; --accent:#60a5fa; --accent-soft:#16264a; --today:#f87171; --past:#334155; --fuzzy:#fbbf24; --fuzzy-soft:#3a2c0a; }
.dB header { padding: 22px 0 14px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
.dB header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.dB header h1 span { color: var(--accent); }
.dB header .d { color: var(--ink2); font-size: 14px; }
.dB .grid { display: grid; grid-template-columns: 420px 1fr; gap: 20px; align-items: start; }
.dB .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.dB .card h2 { margin: 0 0 4px; font-size: 17px; }
.dB .card .sub { color: var(--ink3); font-size: 12.5px; margin-bottom: 14px; }
.dB .tl { position: relative; padding-left: 26px; }
.dB .tl::before { content: ""; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.dB .tl .sec { font-size: 12px; font-weight: 700; color: var(--ink3); margin: 14px 0 8px -26px; letter-spacing: .05em; }
.dB .tl .sec.now { color: var(--today); }
.dB .ev { position: relative; padding: 0 0 14px; }
.dB .ev::before { content: ""; position: absolute; left: -23px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 3px solid var(--accent); }
.dB .ev.fuzzy::before { border-color: var(--fuzzy); border-style: dashed; }
.dB .ev.past::before { border-color: var(--past); }
.dB .ev .when { font-weight: 800; font-size: 14px; }
.dB .ev.fuzzy .when { color: var(--fuzzy); }
.dB .ev.past .when { color: var(--ink2); }
.dB .ev .badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
.dB .ev.fuzzy .badge { background: var(--fuzzy-soft); color: var(--fuzzy); }
.dB .ev .t { font-size: 14px; margin: 3px 0; line-height: 1.45; }
.dB .ev .m { font-size: 12px; color: var(--ink3); }
.dB .todayline { margin: 6px 0 14px -26px; display: flex; align-items: center; gap: 8px; color: var(--today); font-size: 12px; font-weight: 700; }
.dB .todayline::after { content: ""; flex: 1; height: 2px; background: var(--today); opacity: .5; }
.dB .chips { margin-bottom: 12px; }
.dB .chip { font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); }
.dB .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.dB .news { display: flex; flex-direction: column; gap: 10px; }
.dB .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.dB .item .top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink3); margin-bottom: 4px; flex-wrap: wrap; }
.dB .item .cat { font-weight: 700; color: var(--accent); }
.dB .item .off { font-weight: 700; color: #fff; background: var(--ink); padding: 0 6px; border-radius: 4px; }
[data-theme="dark"] .dB .item .off { color: var(--bg); }
.dB .item h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.4; }
.dB .item p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.6; }
.dB .item .srcs { margin-top: 8px; font-size: 12px; color: var(--ink3); }
.dB .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.dB .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.dB .row:last-child { border-bottom: 0; }
.dB .row .n { font-family: "JetBrains Mono", monospace; font-weight: 600; white-space: nowrap; }
.dB footer { margin: 24px 0 0; padding: 18px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }
@media (max-width: 900px) { .dB .grid, .dB .twocol { grid-template-columns: 1fr; } }

/* ═════════ C · 카드 대시보드 ═════════ */
.dC { --bg:#f2f4f6; --card:#fff; --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --line:#e5e8eb; --blue:#3182f6; --blue-soft:#e8f3ff; --red:#f04452; --red-soft:#ffeeee; --green:#0f9d58; --amber:#ff9f0a; --amber-soft:#fff4e0;
  background: var(--bg); color: var(--ink); }
[data-theme="dark"] .dC { --bg:#101113; --card:#1c1d21; --ink:#f2f4f6; --ink2:#b0b8c1; --ink3:#6b7684; --line:#2b2d33; --blue:#4c9aff; --blue-soft:#14243d; --red:#ff6b77; --red-soft:#3a1a1e; --green:#3ddc84; --amber:#ffb340; --amber-soft:#3a2a0e; }
.dC header { padding: 22px 0 6px; }
.dC header h1 { margin: 0; font-size: 24px; font-weight: 800; }
.dC header p { margin: 4px 0 0; color: var(--ink3); font-size: 14px; }
.dC .chips { margin: 14px 0; position: sticky; top: 46px; z-index: 5; background: var(--bg); padding: 8px 0; }
.dC .chip { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 99px; background: var(--card); color: var(--ink2); }
.dC .chip.on { background: var(--ink); color: var(--bg); }
.dC .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.dC .stat { background: var(--card); border-radius: 18px; padding: 16px 18px; }
.dC .stat .k { font-size: 13px; color: var(--ink3); }
.dC .stat .v { font-size: 28px; font-weight: 800; margin-top: 4px; letter-spacing: -.02em; }
.dC .stat .v small { font-size: 14px; font-weight: 600; color: var(--ink3); margin-left: 2px; }
.dC .stat .x { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.dC h2 { font-size: 19px; margin: 26px 0 12px; display: flex; align-items: baseline; gap: 8px; }
.dC h2 small { font-size: 13px; color: var(--ink3); font-weight: 500; }
.dC .hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.dC .chg { background: var(--card); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.dC .dd { align-self: flex-start; font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); }
.dC .dd.fz { background: var(--amber-soft); color: var(--amber); }
.dC .dd.ps { background: var(--line); color: var(--ink2); }
.dC .chg .t { font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.dC .chg .raw { font-size: 12px; color: var(--ink3); }
.dC .chg .src { margin-top: auto; font-size: 12px; color: var(--ink3); }
.dC .feed { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dC .nc { background: var(--card); border-radius: 18px; padding: 18px; }
.dC .nc .top { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.dC .pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); }
.dC .pill.o { background: var(--red-soft); color: var(--red); }
.dC .pill.g { background: var(--line); color: var(--ink2); }
.dC .nc h3 { margin: 0 0 8px; font-size: 16.5px; line-height: 1.4; }
.dC .nc ul { margin: 0; padding-left: 18px; color: var(--ink2); font-size: 13.5px; line-height: 1.65; }
.dC .nc .src { margin-top: 10px; font-size: 12px; color: var(--ink3); }
.dC .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dC .box { background: var(--card); border-radius: 18px; padding: 18px; }
.dC .li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dC .li:last-child { border-bottom: 0; }
.dC .li .n { font-weight: 800; white-space: nowrap; }
.dC .li .n.up { color: var(--red); } .dC .li .n.dn { color: var(--blue); }
.dC .st { display: flex; flex-wrap: wrap; gap: 8px; }
.dC .st span { font-size: 12.5px; padding: 6px 10px; background: var(--card); border-radius: 10px; color: var(--ink2); }
.dC .st span.w { color: var(--amber); }
.dC footer { padding: 24px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; }
@media (max-width: 860px) { .dC .stats { grid-template-columns: 1fr 1fr; } .dC .feed, .dC .split { grid-template-columns: 1fr; } .dC .chips { top: 84px; } }

/* ═════════ D · 오로라 HUD (vibe-radar 테마) ═════════ */
.dD { --bg:#f3f5fc; --au1:rgba(167,139,250,.38); --au2:rgba(34,211,238,.30); --au3:rgba(244,114,182,.26);
  --panel:rgba(255,255,255,.72); --line:rgba(8,145,178,.20); --row:rgba(15,23,42,.07); --chip:rgba(255,255,255,.8);
  --text:#0f172a; --text2:#334155; --text3:#64748b; --cyan:#0e7490; --violet:#6d28d9; --pink:#a21caf; --green:#047857; --amber:#b45309; --red:#e11d48;
  --g1:#4c1d95; --g2:#c026d3; --shadow:0 10px 30px rgba(76,29,149,.08);
  position: relative; background: var(--bg); color: var(--text); overflow: hidden; }
[data-theme="dark"] .dD { --bg:#070814; --au1:rgba(124,58,237,.55); --au2:rgba(6,182,212,.45); --au3:rgba(236,72,153,.35);
  --panel:rgba(10,12,30,.55); --line:rgba(165,243,252,.14); --row:rgba(255,255,255,.06); --chip:rgba(255,255,255,.05);
  --text:#eaf2ff; --text2:#c7d2fe; --text3:#8b9bc4; --cyan:#67e8f9; --violet:#c4b5fd; --pink:#f0abfc; --green:#86efac; --amber:#fcd34d; --red:#fb7185;
  --g1:#fff; --g2:#f0abfc; --shadow:none; }
.dD .aur { position: absolute; inset: -20%; pointer-events: none; filter: blur(60px);
  background: radial-gradient(40% 30% at 15% 10%, var(--au1), transparent 70%), radial-gradient(35% 30% at 85% 15%, var(--au2), transparent 70%), radial-gradient(40% 35% at 60% 80%, var(--au3), transparent 70%); }
.dD .wrap { position: relative; }
.dD header { padding: 24px 0 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.dD .logo { font-family: "Space Grotesk"; font-weight: 700; font-size: 26px; background: linear-gradient(90deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dD .logo small { font-family: "JetBrains Mono"; font-size: 12px; color: var(--text3); -webkit-text-fill-color: var(--text3); margin-left: 8px; font-weight: 400; }
.dD .clock { font-family: "JetBrains Mono"; font-size: 12px; color: var(--text3); }
.dD .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; backdrop-filter: blur(14px); box-shadow: var(--shadow); }
.dD .ph { font-family: "JetBrains Mono"; font-size: 11.5px; letter-spacing: .12em; color: var(--cyan); margin-bottom: 10px; display: flex; justify-content: space-between; }
.dD .grid { display: grid; grid-template-columns: 1.1fr 1.6fr; gap: 14px; }
.dD .chips { margin: 10px 0 14px; }
.dD .chip { font-family: "JetBrains Mono"; font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--text2); }
.dD .chip.on { border-color: var(--violet); color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset; }
.dD .cd { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--row); }
.dD .cd:last-child { border-bottom: 0; }
.dD .cd .w { font-family: "JetBrains Mono"; font-weight: 800; font-size: 13px; color: var(--violet); line-height: 1.3; }
.dD .cd.fz .w { color: var(--amber); }
.dD .cd.ps .w { color: var(--text3); }
.dD .cd .t { font-size: 14px; font-weight: 600; line-height: 1.4; }
.dD .cd .m { font-size: 11.5px; color: var(--text3); margin-top: 3px; font-family: "JetBrains Mono"; }
.dD .hot { padding: 12px 0; border-bottom: 1px solid var(--row); }
.dD .hot:last-child { border-bottom: 0; }
.dD .hot .top { display: flex; gap: 8px; align-items: center; font-family: "JetBrains Mono"; font-size: 11px; color: var(--text3); margin-bottom: 4px; flex-wrap: wrap; }
.dD .hot .cat { color: var(--cyan); }
.dD .hot .off { color: var(--pink); }
.dD .heat { display: inline-block; width: 60px; height: 5px; border-radius: 9px; background: var(--row); overflow: hidden; vertical-align: middle; }
.dD .heat i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
.dD .hot h3 { margin: 0 0 4px; font-size: 15.5px; line-height: 1.4; }
.dD .hot p { margin: 0; font-size: 13px; color: var(--text2); line-height: 1.6; }
.dD .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 14px; }
.dD .li { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--row); }
.dD .li:last-child { border-bottom: 0; }
.dD .li .n { font-family: "JetBrains Mono"; font-weight: 800; white-space: nowrap; color: var(--green); }
.dD .li .n.up { color: var(--red); }
.dD .ok { color: var(--green); } .dD .warn { color: var(--amber); }
.dD footer { position: relative; padding: 20px 0 40px; color: var(--text3); font-size: 12px; line-height: 1.7; }
@media (max-width: 900px) { .dD .grid, .dD .row3 { grid-template-columns: 1fr; } }

/* ═════════ E · 종류별 보드 ═════════ */
.dE { --bg:#fafaf7; --col:#fff; --ink:#18181b; --ink2:#52525b; --ink3:#a1a1aa; --line:#e7e5e4;
  --car:#0369a1; --car-soft:#e0f2fe; --med:#be123c; --med-soft:#ffe4e6; --life:#15803d; --life-soft:#dcfce7; --ind:#6b21a8; --ind-soft:#f3e8ff; --fz:#b45309;
  background: var(--bg); color: var(--ink); }
[data-theme="dark"] .dE { --bg:#0c0c0e; --col:#161618; --ink:#f4f4f5; --ink2:#a1a1aa; --ink3:#63636b; --line:#27272a;

const tabs = document.getElementById('tabs');
const show = (k) => {
  document.querySelectorAll('.design').forEach((s) => s.classList.toggle('on', s.id === k));
  tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  try { localStorage.setItem('ir-mock-tab', k); } catch (e) {}
};
Object.entries(NAMES).forEach(([k, n]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = n; b.onclick = () => show(k); tabs.appendChild(b); });
let saved = 'A'; try { saved = localStorage.getItem('ir-mock-tab') || 'A'; } catch (e) {}
show(NAMES[saved] ? saved : 'A');

const themeBtn = document.getElementById('theme');
const setTheme = (t) => { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
setTheme('light');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  const sec = chip.closest('.design'); const f = chip.dataset.f;
  sec.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
  sec.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('hide', f !== '전체' && el.dataset.cat !== f));
});

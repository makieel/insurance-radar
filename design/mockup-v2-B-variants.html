<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 레이더 시안 v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ── 시안 공통 틀 (실제 사이트 화면 아님) ── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Pretendard, system-ui, sans-serif; background: #e9ebf0; -webkit-font-smoothing: antialiased; }
[data-theme="dark"] body { background: #0b0d12; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #1f2430; color: #fff; font-size: 13px; }
.bar b { font-weight: 700; margin-right: 6px; }
.bar .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.bar button { font: inherit; border: 1px solid #4a5263; background: transparent; color: #cfd6e4; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.bar button.on { background: #fff; color: #1f2430; border-color: #fff; font-weight: 700; }
.bar .sp { flex: 1; }
.bar .note { color: #9aa4b8; font-size: 12px; width: 100%; }
.design { display: none; min-height: 100vh; }
.design.on { display: block; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.hide { display: none !important; }
.mono { font-family: "JetBrains Mono", monospace; }

/* ── B 계열 공통 부품 (변수만 시안마다 다름) ── */
.vb { --bg:#f7f8fa; --panel:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0; --accent:#2563eb; --accent-soft:#dbeafe; --today:#ef4444; --past:#cbd5e1; --fz:#d97706; --fz-soft:#fef3c7; --radius:14px;
  --car:#0284c7; --med:#e11d48; --life:#16a34a; --ind:#7c3aed;
  background: var(--bg); color: var(--ink); padding-bottom: 10px; }
.vb header { padding: 22px 0 14px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
.vb header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.vb header h1 span { color: var(--accent); }
.vb header .d { color: var(--ink2); font-size: 13.5px; }
.vb .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.vb .card > h2 { margin: 0 0 4px; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.vb .card > h2 small { font-size: 12px; color: var(--ink3); font-weight: 500; }
.vb .sub { color: var(--ink3); font-size: 12.5px; margin-bottom: 14px; }
.vb .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.vb .chip { cursor: pointer; user-select: none; font-size: 13px; padding: 5px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--ink2); }
.vb .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.vb .catdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--c, var(--ink3)); }
.vb .c-car { --c: var(--car); } .vb .c-med { --c: var(--med); } .vb .c-life { --c: var(--life); } .vb .c-ind { --c: var(--ind); }
/* 세로 타임라인 */
.vb .tl { position: relative; padding-left: 26px; }
.vb .tl::before { content: ""; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.vb .tl .sec { font-size: 12px; font-weight: 700; color: var(--ink3); margin: 14px 0 8px -26px; letter-spacing: .05em; }
.vb .ev { position: relative; padding: 0 0 14px; }
.vb .ev::before { content: ""; position: absolute; left: -23px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 3px solid var(--accent); }
.vb .ev.fz::before { border-color: var(--fz); border-style: dashed; }
.vb .ev.past::before { border-color: var(--past); }
.vb .ev .when { font-weight: 800; font-size: 14px; }
.vb .ev.fz .when { color: var(--fz); }
.vb .ev.past .when { color: var(--ink2); }
.vb .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; white-space: nowrap; }
.vb .badge.fz { background: var(--fz-soft); color: var(--fz); }
.vb .badge.ps { background: var(--line); color: var(--ink2); }
.vb .ev .t { font-size: 14px; margin: 3px 0; line-height: 1.45; }
.vb .ev .m { font-size: 12px; color: var(--ink3); }
.vb .todayline { margin: 6px 0 14px -26px; display: flex; align-items: center; gap: 8px; color: var(--today); font-size: 12px; font-weight: 700; }
.vb .todayline::after { content: ""; flex: 1; height: 2px; background: var(--today); opacity: .5; }
/* 소식 카드 */
.vb .news { display: flex; flex-direction: column; gap: 10px; }
.vb .item { background: var(--panel); border: 1px solid var(--line); border-radius: calc(var(--radius) - 2px); padding: 14px 16px; }
.vb .item .top { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink3); margin-bottom: 4px; flex-wrap: wrap; }
.vb .item .cat { font-weight: 700; color: var(--c, var(--accent)); }
.vb .off { font-weight: 700; color: var(--panel); background: var(--ink); padding: 0 6px; border-radius: 4px; font-size: 11.5px; }
.vb .item h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.4; }
.vb .item p { margin: 0; font-size: 13.5px; color: var(--ink2); line-height: 1.6; }
.vb .item .srcs { margin-top: 8px; font-size: 12px; color: var(--ink3); }
.vb .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.vb .row:last-child { border-bottom: 0; }
.vb .row .n { font-family: "JetBrains Mono", monospace; font-weight: 600; white-space: nowrap; }
.vb .n.up { color: var(--med); } .vb .n.dn { color: var(--car); }
.vb .status { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); }
.vb .status .w { color: var(--fz); }
.vb footer { margin: 24px 0 0; padding: 18px 0 40px; color: var(--ink3); font-size: 12px; line-height: 1.7; border-top: 1px solid var(--line); }

/* ═════════ 1 · 정돈형 (B 다듬기) ═════════ */
[data-theme="dark"] .v1 { --bg:#0b1120; --panel:#111a2e; --ink:#e2e8f0; --ink2:#a3b1c6; --ink3:#64748b; --line:#1e2a44; --accent:#60a5fa; --accent-soft:#16264a; --today:#f87171; --past:#334155; --fz:#fbbf24; --fz-soft:#3a2c0a; --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#a78bfa; }
.v1 .brief { display: flex; flex-wrap: wrap; gap: 8px 22px; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; }
.v1 .brief b { color: var(--accent); }
.v1 .grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
.v1 .stick { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; }
.v1 .tabsx { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.v1 .tabsx span { padding: 8px 12px; font-size: 14px; font-weight: 600; color: var(--ink3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.v1 .tabsx span.on { color: var(--accent); border-color: var(--accent); }
@media (max-width: 900px) { .v1 .grid { grid-template-columns: 1fr; } .v1 .stick { position: static; max-height: none; } }

/* ═════════ 2 · 가로 타임라인 ═════════ */
.v2 { --bg:#f3f8f7; --accent:#0f766e; --accent-soft:#ccfbf1; --line:#d9e6e3; --fz:#c2410c; --fz-soft:#ffedd5; }
[data-theme="dark"] .v2 { --bg:#071412; --panel:#0d1f1c; --ink:#e3f1ee; --ink2:#9fbab4; --ink3:#5f7b75; --line:#173430; --accent:#2dd4bf; --accent-soft:#0c3a35; --today:#fb7185; --past:#2b4743; --fz:#fb923c; --fz-soft:#3a1d08; --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#a78bfa; }
.v2 .htl { display: grid; grid-template-columns: 1fr 300px; gap: 0; }
.v2 .axis { position: relative; height: 270px; margin: 0 8px; }
.v2 .axis .base { position: absolute; left: 0; right: 0; top: 135px; height: 2px; background: var(--line); }
.v2 .axis .tick { position: absolute; top: 128px; width: 1px; height: 16px; background: var(--ink3); }
.v2 .axis .tlab { position: absolute; top: 148px; font-size: 11px; color: var(--ink3); transform: translateX(-50%); white-space: nowrap; }
.v2 .axis .now { position: absolute; top: 8px; bottom: 8px; width: 2px; background: var(--today); }
.v2 .axis .now span { position: absolute; top: -2px; left: 6px; font-size: 11.5px; font-weight: 700; color: var(--today); white-space: nowrap; }
.v2 .pin { position: absolute; width: 150px; transform: translateX(-12px); font-size: 12.5px; line-height: 1.35; }
.v2 .pin::before { content: ""; position: absolute; left: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 3px solid var(--c, var(--accent)); }
.v2 .pin.up { bottom: 145px; padding-bottom: 6px; } .v2 .pin.up::before { bottom: -16px; }
.v2 .pin.dn { top: 170px; padding-top: 0; } .v2 .pin.dn::before { top: -41px; }
.v2 .pin b { display: block; font-size: 12px; color: var(--c, var(--accent)); }
.v2 .bucket { border-left: 2px dashed var(--fz); padding: 4px 0 0 16px; }
.v2 .bucket h3 { margin: 0 0 8px; font-size: 13px; color: var(--fz); }
.v2 .bk { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; line-height: 1.4; }
.v2 .bk:last-child { border-bottom: 0; }
.v2 .bk .w { font-weight: 800; color: var(--fz); font-size: 12.5px; }
.v2 .bk .m { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.v2 .below { display: grid; grid-template-columns: 1fr 1fr 320px; gap: 14px; margin-top: 16px; align-items: start; }
@media (max-width: 1000px) { .v2 .htl { grid-template-columns: 1fr; } .v2 .bucket { border-left: 0; border-top: 2px dashed var(--fz); padding: 12px 0 0; margin-top: 8px; } .v2 .below { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .v2 .axiswrap { overflow-x: auto; } .v2 .axis { min-width: 680px; } }

/* ═════════ 3 · 종류별 레인 ═════════ */
.v3 { --bg:#f5f5fb; --accent:#4f46e5; --accent-soft:#e0e7ff; --line:#e4e4f0; --fz:#b45309; --fz-soft:#fef3c7; --radius:10px; }
[data-theme="dark"] .v3 { --bg:#0c0b16; --panel:#15142a; --ink:#ecebff; --ink2:#a9a7d0; --ink3:#6b6a94; --line:#26244a; --accent:#a5b4fc; --accent-soft:#25235a; --today:#f87171; --past:#3a3866; --fz:#fbbf24; --fz-soft:#3a2c0a; --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#c4b5fd; }
.v3 .lanes { display: grid; grid-template-columns: 150px 1fr 26px 1fr; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.v3 .lanes > div { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.v3 .lh { font-size: 12px; font-weight: 700; color: var(--ink3); background: var(--bg); }
.v3 .lh.fzh { color: var(--fz); }
.v3 .ln { font-weight: 800; font-size: 14px; color: var(--c); border-left: 4px solid var(--c); display: flex; align-items: center; }
.v3 .nowcol { background: repeating-linear-gradient(180deg, var(--today) 0 6px, transparent 6px 12px); background-size: 2px 100%; background-repeat: no-repeat; background-position: center; padding: 0 !important; }
.v3 .nowh { color: var(--today); font-size: 11px; font-weight: 700; text-align: center; padding: 10px 0 !important; }
.v3 .cell { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.v3 .tk { flex: 1 1 200px; max-width: 320px; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; background: var(--panel); }
.v3 .tk.fz { border-left-style: dashed; border-left-color: var(--fz); }
.v3 .tk .w { font-weight: 800; font-size: 12px; color: var(--ink2); }
.v3 .tk.fz .w { color: var(--fz); }
.v3 .tk .m { font-size: 11.5px; color: var(--ink3); margin-top: 3px; }
.v3 .none { font-size: 12px; color: var(--ink3); }
.v3 .feed3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.v3 .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
@media (max-width: 900px) { .v3 .lanes { grid-template-columns: 1fr; } .v3 .nowcol, .v3 .nowh, .v3 .lh.blank { display: none; } .v3 .lh { padding-top: 6px !important; } .v3 .feed3, .v3 .two { grid-template-columns: 1fr; } }

/* ═════════ 4 · 달력형 ═════════ */
.v4 { --bg:#fbf7f4; --panel:#fff; --accent:#e8590c; --accent-soft:#ffe8d9; --line:#f0e4dc; --ink:#2b1d16; --ink2:#6b5548; --ink3:#a8968b; --fz:#9a3412; --fz-soft:#fde2cf; --today:#e8590c; --radius:20px; }
[data-theme="dark"] .v4 { --bg:#140e0b; --panel:#1f1712; --ink:#f6ebe4; --ink2:#c4ab9c; --ink3:#7d685c; --line:#33261e; --accent:#ff8a3d; --accent-soft:#3d2112; --today:#ff8a3d; --past:#3e2f26; --fz:#fdba74; --fz-soft:#3a2010; --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#c4b5fd; }
.v4 .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
.v4 .months { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.v4 .mon h3 { margin: 0 0 6px; font-size: 14px; }
.v4 .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11.5px; text-align: center; }
.v4 .cal .dw { color: var(--ink3); font-size: 10.5px; padding: 2px 0; }
.v4 .cal .dc { position: relative; padding: 5px 0 9px; border-radius: 8px; color: var(--ink2); }
.v4 .cal .dc.on { background: var(--accent-soft); color: var(--ink); font-weight: 800; cursor: help; }
.v4 .cal .dc.on::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--c, var(--accent)); }
.v4 .cal .dc.today { outline: 2px solid var(--today); outline-offset: -2px; color: var(--today); font-weight: 800; }
.v4 .legend { font-size: 11.5px; color: var(--ink3); margin: 10px 0 0; }
.v4 .lst { margin-top: 14px; }
.v4 .lst h4 { margin: 12px 0 6px; font-size: 12.5px; color: var(--ink3); }
.v4 .lst h4.fzh { color: var(--fz); }
.v4 .li4 { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.4; }
.v4 .li4:last-child { border-bottom: 0; }
.v4 .li4 .w { font-weight: 800; font-size: 12.5px; color: var(--ink2); }
.v4 .li4.fz .w { color: var(--fz); }
.v4 .li4 .m { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.v4 .item { border-radius: 16px; }
.v4 .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.v4 .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
@media (max-width: 900px) { .v4 .grid, .v4 .two { grid-template-columns: 1fr; } }

/* ═════════ 5 · 3단 레일 ═════════ */
.v5 { --bg:#f6f7f8; --accent:#059669; --accent-soft:#d1fae5; --line:#e3e6ea; --ink:#111827; --ink2:#4b5563; --ink3:#9ca3af; --fz:#b45309; --fz-soft:#fef3c7; --radius:8px; }
[data-theme="dark"] .v5 { --bg:#090b0d; --panel:#121518; --ink:#e5e7eb; --ink2:#9ca3af; --ink3:#5b6370; --line:#22272d; --accent:#34d399; --accent-soft:#0b3326; --today:#f87171; --past:#2f3640; --fz:#fbbf24; --fz-soft:#3a2c0a; --car:#38bdf8; --med:#fb7185; --life:#4ade80; --ind:#c4b5fd; }
.v5 .wrap { max-width: 1320px; }
.v5 header { border-bottom: 1px solid var(--line); margin-bottom: 14px; padding-bottom: 12px; }
.v5 .g3 { display: grid; grid-template-columns: 300px 1fr 300px; gap: 16px; align-items: start; }
.v5 .card { padding: 14px; }
.v5 .card > h2 { font-size: 13px; letter-spacing: .06em; color: var(--ink2); text-transform: none; }
.v5 .ev .t { font-size: 13px; }
.v5 .ev .when { font-size: 13px; }
.v5 .lead { padding: 18px 20px; }
.v5 .lead h3 { font-size: 20px; }
.v5 .lead p { font-size: 14.5px; }
.v5 .rail { display: flex; flex-direction: column; gap: 14px; }
.v5 .rail .row { font-size: 12.5px; padding: 6px 0; }
@media (max-width: 1100px) { .v5 .g3 { grid-template-columns: 280px 1fr; } .v5 .rail { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .v5 .g3, .v5 .rail { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="bar">
  <b>보험 레이더 · 시안 v2 (B 바탕)</b>
  <div class="tabs" id="tabs"></div>
  <span class="sp"></span>
  <button id="theme" type="button">☾ 다크</button>
  <div class="note">2026-10-23에 실제로 수집한 제목·날짜·출처를 넣었습니다. 요약 문장은 시안용으로 원문 첫 문단에서 옮겨 적은 예시이고, 실제 사이트에서는 AI 요약 + 근거 검증을 거칩니다.</div>
</div>

<section class="design vb v1" id="S1"></section>
<section class="design vb v2" id="S2"></section>
<section class="design vb v3" id="S3"></section>
<section class="design vb v4" id="S4"></section>
<section class="design vb v5" id="S5"></section>

<script>

  { exact: false, when: "'27.1월", raw: "원문 \"'27.1월 시행사항\"", pub: '2026-06-30', src: '금융위원회', cat: '제도·공통',

  { exact: false, when: '연말까지', raw: '원문 "연말까지 실손24 연계율 80~90% 목표"', pub: '2026-09-30', src: '금융위원회', cat: '실손',

})();

// ── 4 · 달력형 ──
(() => {
  const exact = recent.filter((c) => c.exact);
  const byDate = {}; exact.forEach((c) => (byDate[c.date] = byDate[c.date] || []).push(c));
  const month = (y, m) => {
    const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    let cells = ['일', '월', '화', '수', '목', '금', '토'].map((d) => `<div class="dw">${d}</div>`).join('') + '<div></div>'.repeat(first);
    for (let d = 1; d <= days; d++) {
      const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const evs = byDate[key];
      cells += `<div class="dc${evs ? ' on ' + cc(evs[0].cat) : ''}${key === TODAY ? ' today' : ''}"${evs ? ` title="${esc(evs.map((e) => e.title).join(' / '))}"` : ''}>${d}</div>`;
    }
    return `<div class="mon"><h3>${y}년 ${m}월</h3><div class="cal">${cells}</div></div>`;
  };
  const li = (c) => `<div class="li4 ${c.exact ? '' : 'fz'}" data-cat="${c.cat}"><div class="w">${c.exact ? md(c.date) + '<br>' + dLabel(c) : esc(c.when)}</div><div>${link(c)}<div class="m">${esc(c.raw)} · ${c.src}</div></div></div>`;
  document.getElementById('S4').innerHTML = `<div class="wrap">
    ${head('보험 <span>레이더</span>')}
    <div class="grid">
      <div class="card"><h2>바뀌는 것</h2><div class="sub">날짜가 정확한 항목만 달력에 점으로 찍습니다.</div>
        <div class="months">${month(2026, 9)}${month(2026, 10)}</div>
        <div class="legend">● 시행일 · □ 오늘 · 점에 마우스를 올리면 내용이 보입니다</div>
        <div class="lst"><h4 class="fzh">예정 · 날짜 미확정 (원문 표현)</h4>${upcoming.map(li).join('')}<h4>최근 시행</h4>${recent.map(li).join('')}</div>
      </div>
      <div>${chipsHtml()}<div class="news">${NEWS.map((n) => newsItem(n)).join('')}${OFFICIAL.slice(0, 2).map(offItem).join('')}</div>
        <div class="two"><div class="card"><h2>업계 동향</h2>${industryRows()}</div><div class="card"><h2>자동차보험료 조정</h2>${rateRows(6)}</div></div>
      </div>
    </div>
    <footer>${statusHtml()}<br>${DISCLAIMER}</footer></div>`;
})();

// ── 5 · 3단 레일 ──
document.getElementById('S5').innerHTML = `<div class="wrap">
  ${head('보험 <span>레이더</span>')}
  ${chipsHtml()}
  <div class="g3">
    <div class="card"><h2>바뀌는 것</h2><div class="sub">점선 = 시행일 미확정</div>${timelineHtml()}</div>
    <div class="news">${newsItem(NEWS[0], 'lead')}${NEWS.slice(1).map((n) => newsItem(n)).join('')}${OFFICIAL.slice(0, 2).map(offItem).join('')}</div>
    <div class="rail">
      <div class="card"><h2>자동차보험료 조정</h2>${rateRows(7)}</div>
      <div class="card"><h2>정부·감독기관</h2>${officialRows()}</div>
      <div class="card"><h2>업계 동향</h2>${industryRows()}</div>
      <div class="card"><h2>수집 상태</h2>${STATUS.map((s) => `<div class="row"><span>${s[0]}</span><span class="n" style="color:${s[1] === 'ok' ? 'var(--accent)' : 'var(--fz)'}">${s[1] === 'ok' ? 'OK' : '점검'}</span></div>`).join('')}</div>
    </div>
  </div>
  <footer>${DISCLAIMER}</footer></div>`;

// ── 탭 · 테마 · 필터 ──
const NAMES = { S1: '1 · 정돈형', S2: '2 · 가로 타임라인', S3: '3 · 종류별 레인', S4: '4 · 달력형', S5: '5 · 3단 레일' };
const tabs = document.getElementById('tabs');
const show = (k) => {
  document.querySelectorAll('.design').forEach((s) => s.classList.toggle('on', s.id === k));
  tabs.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  try { localStorage.setItem('ir-mock2-tab', k); } catch (e) {}
};
Object.entries(NAMES).forEach(([k, n]) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = n; b.onclick = () => show(k); tabs.appendChild(b); });
let saved = 'S1'; try { saved = localStorage.getItem('ir-mock2-tab') || 'S1'; } catch (e) {}
show(NAMES[saved] ? saved : 'S1');

const themeBtn = document.getElementById('theme');
const setTheme = (t) => { document.documentElement.dataset.theme = t; themeBtn.textContent = t === 'dark' ? '☀ 밝은 모드' : '☾ 다크'; };
setTheme('light');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    const sec = chip.closest('.design'), f = chip.dataset.f;
    sec.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === chip));
    sec.querySelectorAll('[data-cat]').forEach((el) => el.classList.toggle('hide', f !== '전체' && el.dataset.cat !== f));
    return;
  }
  const tab = e.target.closest('.tabsx span');
  if (tab) {
    const box = tab.closest('.card');
    box.querySelectorAll('.tabsx span').forEach((s) => s.classList.toggle('on', s === tab));
    box.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle('hide', p.dataset.pane !== tab.dataset.p));
  }
});
</script>
</body>
</html>

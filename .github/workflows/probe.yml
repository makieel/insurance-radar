name: probe-sources

on:
  push:
    branches: [main]
    paths: ['scripts/probe-sources.mjs', '.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/probe-sources.mjs

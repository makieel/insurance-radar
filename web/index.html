<!doctype html>
<html lang="ko" data-mode="light">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보험 레이더</title>
<meta name="description" content="개인 보험 소식과 바뀌는 것(약관·보험료·제도 변경과 시행일)을 매일 자동으로 모아 보여 줍니다.">
<script>
  // 그리기 전에 저장된 모드를 적용해 번쩍임을 막는다(기본 light).
  try {
    var m = localStorage.getItem('ir-mode');
    if (m === 'dark' || m === 'light') document.documentElement.dataset.mode = m;
  } catch (e) {}
</script>
